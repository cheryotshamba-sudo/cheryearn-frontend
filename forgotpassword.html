<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CheryEarn</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            color: #00c853;
        }

        .logo p {
            color: #999;
            font-size: 14px;
            margin-top: 6px;
        }

        .card {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 16px;
            padding: 25px 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
        }

        .card h2 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 9px;
            border: 1px solid #333;
            background: #0d0d0d;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #00c853;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #00c853;
            color: #000;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            line-height: 1.4;
        }

        .success {
            display: block;
            background: #10351e;
            color: #55e889;
        }

        .error {
            display: block;
            background: #3a1111;
            color: #ff7777;
        }

        .back {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #999;
        }

        .back a {
            color: #00c853;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>CheryEarn</h1>
        <p>Earn • Refer • Grow</p>
    </div>

    <div class="card">

        <h2>Forgot Password?</h2>

        <p class="subtitle">
            Enter the email or phone number linked to your
            CheryEarn account to request a password reset.
        </p>

        <form id="forgotForm">

            <div class="form-group">
                <label for="identifier">
                    Email or Phone Number
                </label>

                <input
                    type="text"
                    id="identifier"
                    name="identifier"
                    placeholder="Enter email or phone"
                    required
                >
            </div>

            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                Request Reset
            </button>

            <div id="message" class="message"></div>

        </form>

        <div class="back">
            Remember your password?
            <a href="login.html">Login</a>
        </div>

    </div>

</div>

<script>

    const API_URL = "https://cheryearn-backend.onrender.com";

    const form = document.getElementById("forgotForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async function(e) {

        e.preventDefault();

        const identifier =
            document.getElementById("identifier")
                .value
                .trim();

        if (!identifier) {

            showMessage(
                "Please enter your email or phone number.",
                "error"
            );

            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending...";

        clearMessage();

        try {

            const response = await fetch(
                `${API_URL}/api/auth/forgot-password`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        identifier: identifier
                    })
                }
            );

            const data = await response.json();

            if (!response.ok || data.success === false) {

                throw new Error(
                    data.message ||
                    "Unable to process password reset request."
                );
            }

            showMessage(
                data.message ||
                "If the account exists, password reset instructions have been sent.",
                "success"
            );

            document.getElementById("identifier").value = "";

        } catch (error) {

            showMessage(
                error.message ||
                "Something went wrong. Please try again.",
                "error"
            );

        } finally {

            submitBtn.disabled = false;
            submitBtn.textContent = "Request Reset";
        }

    });

    function showMessage(text, type) {

        message.className =
            `message ${type}`;

        message.textContent = text;
    }

    function clearMessage() {

        message.className = "message";
        message.textContent = "";
    }

</script>

</body>
</html>
