<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - CheryEarn</title>

    <style>

        :root {
            --bg: #050e25;
            --header: #0b1535;
            --card: #0d1738;
            --border: #202d4e;

            --white: #f5f7fc;
            --muted: #9aa8c2;

            --blue: #1f5fea;
            --green: #43d878;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--white);
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        header {
            background: var(--header);
            border-bottom: 1px solid var(--border);
            padding: 18px 20px;
            text-align: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--white);
            margin-bottom: 5px;
        }

        .tagline {
            color: var(--muted);
            font-size: 13px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            padding: 25px 18px 35px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px 18px;
        }

        h1 {
            margin: 0 0 7px;
            font-size: 24px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--white);
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: var(--blue);
        }

        input::placeholder {
            color: #66738e;
        }

        #referralCode {
            background: #08122d;
            cursor: not-allowed;
        }

        .referral-info {
            color: var(--muted);
            font-size: 12px;
            margin-top: 6px;
        }

        .referral-status {
            font-size: 12px;
            margin-top: 6px;
        }

        .referral-status.success {
            color: var(--green);
        }

        .referral-status.error {
            color: #ff7777;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--green);
            color: #04100a;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            opacity: 0.92;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            text-align: center;
        }

        .message.error {
            display: block;
            background: rgba(220, 50, 50, 0.12);
            border: 1px solid rgba(220, 50, 50, 0.35);
            color: #ff7777;
        }

        .message.success {
            display: block;
            background: rgba(67, 216, 120, 0.10);
            border: 1px solid rgba(67, 216, 120, 0.35);
            color: var(--green);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
            font-size: 14px;
        }

        .login-link a {
            color: var(--green);
            text-decoration: none;
            font-weight: 700;
        }

        footer {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            padding: 0 20px 25px;
        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        CheryEarn
    </div>

    <div class="tagline">
        Earn • Refer • Grow
    </div>

</header>


<div class="container">

    <div class="card">

        <h1>
            Create Account
        </h1>

        <div class="subtitle">
            Join CheryEarn today
        </div>


        <form id="registerForm">


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="0712345678"
                    autocomplete="tel"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- ==================================================
                 REFERRAL
                 THIS IS BELOW CONFIRM PASSWORD
                 ================================================== -->

            <div class="form-group">

                <label for="referralCode">
                    Referral
                </label>

                <input
                    type="text"
                    id="referralCode"
                    placeholder="Referral"
                    autocomplete="off"
                    readonly
                >

                <div class="referral-info">
                    Referral is automatically assigned and cannot be changed.
                </div>

                <div
                    id="referralStatus"
                    class="referral-status"
                >
                    Checking referral...
                </div>

            </div>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message"
            ></div>


            <!-- BUTTON -->

            <button
                type="submit"
                id="registerBtn"
                disabled
            >
                Checking Referral...
            </button>


        </form>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>


<footer>
    © 2026 CheryEarn. All rights reserved.
</footer>


<script>


    // ==================================================
    // BACKEND
    // ==================================================

    const API_URL =
        "https://cheryearn-backend.onrender.com";


    // ==================================================
    // ELEMENTS
    // ==================================================

    const form =
        document.getElementById(
            "registerForm"
        );

    const referralCodeInput =
        document.getElementById(
            "referralCode"
        );

    const referralStatus =
        document.getElementById(
            "referralStatus"
        );

    const registerBtn =
        document.getElementById(
            "registerBtn"
        );

    const message =
        document.getElementById(
            "message"
        );


    // ==================================================
    // GET MEMBER FROM URL
    // ==================================================

    const params =
        new URLSearchParams(
            window.location.search
        );

    const member =
        params.get("member");


    // Internal referral code.
    // Never editable by the visitor.

    let internalReferralCode =
        null;


    // ==================================================
    // MESSAGE
    // ==================================================

    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            "message " + type;

    }


    // ==================================================
    // VERIFY REFERRAL
    // ==================================================

    async function verifyReferral() {


        /*
         * If somebody opens register.html
         * without a referral link.
         */

        if (!member) {

            referralCodeInput.value =
                "Referral required";

            referralStatus.textContent =
                "Please use a CheryEarn referral link.";

            referralStatus.className =
                "referral-status error";

            showMessage(
                "Please use a valid CheryEarn referral link.",
                "error"
            );

            registerBtn.disabled =
                true;

            registerBtn.textContent =
                "Referral Required";

            return;

        }


        /*
         * Show the exact member from
         * the referral URL immediately.
         *
         * Example:
         * CheryEarn002-cheryot
         */

        referralCodeInput.value =
            member;


        try {

            const response =
                await fetch(
                    `${API_URL}/api/referral/resolve/${encodeURIComponent(member)}`
                );


            const data =
                await response.json();


            console.log(
                "REFERRAL RESPONSE:",
                data
            );


            /*
             * Backend must confirm success.
             */

            if (
                !response.ok ||
                data.success !== true
            ) {

                throw new Error(
                    data.message ||
                    "Referral could not be verified."
                );

            }


            /*
             * Accept the possible response
             * formats from the backend.
             */

            internalReferralCode =
                data.referralCode ||
                data.referral_code ||
                data.user?.referralCode ||
                data.user?.referral_code ||
                data.referrer?.referralCode ||
                data.referrer?.referral_code ||
                data.data?.referralCode ||
                data.data?.referral_code ||
                null;


            /*
             * Referral must have an internal
             * referral code before registration.
             */

            if (!internalReferralCode) {

                throw new Error(
                    "The server did not return the internal referral code."
                );

            }


            // ==================================================
            // SUCCESS
            // ==================================================

            referralStatus.textContent =
                "✓ Referral verified";

            referralStatus.className =
                "referral-status success";


            registerBtn.disabled =
                false;

            registerBtn.textContent =
                "Create Account";


        } catch (error) {

            console.error(
                "Referral verification error:",
                error
            );


            internalReferralCode =
                null;


            referralStatus.textContent =
                "Referral verification failed";

            referralStatus.className =
                "referral-status error";


            showMessage(
                error.message ||
                "This referral link is invalid or has expired.",
                "error"
            );


            registerBtn.disabled =
                true;

            registerBtn.textContent =
                "Invalid Referral";

        }

    }


    // ==================================================
    // REGISTRATION
    // ==================================================

    form.addEventListener(
        "submit",
        async function (e) {

            e.preventDefault();


            if (!internalReferralCode) {

                showMessage(
                    "Valid referral verification is required.",
                    "error"
                );

                return;

            }


            // ==================================================
            // FORM VALUES
            // ==================================================

            const fullName =
                document
                    .getElementById("fullName")
                    .value
                    .trim();


            const phone =
                document
                    .getElementById("phone")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            // ==================================================
            // VALIDATION
            // ==================================================

            if (
                !fullName ||
                !phone ||
                !email ||
                !password
            ) {

                showMessage(
                    "Full name, phone, email and password are required.",
                    "error"
                );

                return;

            }


            if (
                password.length < 6
            ) {

                showMessage(
                    "Password must be at least 6 characters.",
                    "error"
                );

                return;

            }


            if (
                password !==
                confirmPassword
            ) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;

            }


            // ==================================================
            // CREATE ACCOUNT
            // ==================================================

            registerBtn.disabled =
                true;

            registerBtn.textContent =
                "Creating Account...";


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/auth/register`,
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    full_name:
                                        fullName,

                                    phone:
                                        phone,

                                    email:
                                        email,

                                    password:
                                        password,

                                    /*
                                     * VERIFIED INTERNAL
                                     * REFERRAL CODE
                                     */

                                    referral_code:
                                        internalReferralCode

                                })

                        }
                    );


                const data =
                    await response.json();


                console.log(
                    "REGISTRATION RESPONSE:",
                    data
                );


                if (
                    !response.ok ||
                    !data.success
                ) {

                    showMessage(
                        data.message ||
                        "Registration failed. Please try again.",
                        "error"
                    );


                    registerBtn.disabled =
                        false;

                    registerBtn.textContent =
                        "Create Account";

                    return;

                }


                // ==================================================
                // SAVE USER
                // ==================================================

                const user =
                    data.user;


                if (
                    user &&
                    user.id
                ) {

                    localStorage.setItem(
                        "cheryearn_user_id",
                        String(user.id)
                    );

                    localStorage.setItem(
                        "cheryearn_user_phone",
                        user.phone ||
                        phone
                    );

                    localStorage.setItem(
                        "cheryearn_user_email",
                        user.email ||
                        email
                    );

                    localStorage.setItem(
                        "cheryearn_user_name",
                        user.full_name ||
                        fullName
                    );

                    localStorage.setItem(
                        "cheryearn_referral_code",
                        user.referral_code ||
                        ""
                    );

                }


                // ==================================================
                // SUCCESS
                // ==================================================

                showMessage(
                    "Account created successfully. Redirecting to payment...",
                    "success"
                );


                registerBtn.textContent =
                    "Continue to Payment";


                setTimeout(
                    function () {

                        window.location.href =
                            "payment.html";

                    },
                    1200
                );


            } catch (error) {

                console.error(
                    "Registration error:",
                    error
                );


                showMessage(
                    "Unable to connect to the server. Please try again.",
                    "error"
                );


                registerBtn.disabled =
                    false;

                registerBtn.textContent =
                    "Create Account";

            }

        }
    );


    // ==================================================
    // START
    // ==================================================

    verifyReferral();


</script>

</body>

</html>
