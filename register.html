<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - CheryEarn</title>

    <style>
        :root {
            --bg: #050e25;
            --header: #0b1535;
            --card: #0d1738;
            --border: #202d4e;

            --white: #f5f7fc;
            --muted: #9aa8c2;

            --blue: #1f5fea;
            --green: #43d878;
            --yellow: #f4cb2e;

            --bottom: #0b1535;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--white);
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        header {
            background: var(--header);
            border-bottom: 1px solid var(--border);
            padding: 18px 20px;
            text-align: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--white);
            margin-bottom: 5px;
        }

        .tagline {
            color: var(--muted);
            font-size: 13px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            padding: 25px 18px 35px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px 18px;
        }

        h1 {
            margin: 0 0 7px;
            font-size: 24px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--white);
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: var(--blue);
        }

        input::placeholder {
            color: #66738e;
        }

        .referral-info {
            color: var(--muted);
            font-size: 12px;
            margin-top: 6px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--green);
            color: #04100a;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            opacity: 0.92;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            text-align: center;
        }

        .message.error {
            display: block;
            background: rgba(220, 50, 50, 0.12);
            border: 1px solid rgba(220, 50, 50, 0.35);
            color: #ff7777;
        }

        .message.success {
            display: block;
            background: rgba(67, 216, 120, 0.10);
            border: 1px solid rgba(67, 216, 120, 0.35);
            color: var(--green);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
            font-size: 14px;
        }

        .login-link a {
            color: var(--green);
            text-decoration: none;
            font-weight: 700;
        }

        footer {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            padding: 0 20px 25px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">CheryEarn</div>
    <div class="tagline">Earn • Refer • Grow</div>
</header>

<div class="container">

    <div class="card">

        <h1>Create Account</h1>
        <div class="subtitle">Join CheryEarn today</div>

        <form id="registerForm">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="0712345678"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label for="referralCode">Referral Code</label>
                <input
                    type="text"
                    id="referralCode"
                    placeholder="Optional"
                >
                <div class="referral-info">
                    Enter a referral code if someone invited you.
                </div>
            </div>

            <button type="submit" id="registerBtn">
                Create Account
            </button>

            <div id="message" class="message"></div>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

</div>

<footer>
    © 2026 CheryEarn. All rights reserved.
</footer>

<script>
    const API_URL = "https://cheryearn-backend.onrender.com";

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const registerBtn = document.getElementById("registerBtn");

    // Automatically read referral code from:
    // register.html?ref=CHERY123456
    const params = new URLSearchParams(window.location.search);
    const referralFromUrl = params.get("ref");

    if (referralFromUrl) {
        document.getElementById("referralCode").value =
            referralFromUrl.toUpperCase();
    }

    form.addEventListener("submit", async function (e) {
        e.preventDefault();

        message.className = "message";
        message.textContent = "";

        const fullName = document.getElementById("fullName").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;
        const referralCode =
            document.getElementById("referralCode").value.trim();

        if (!fullName || !phone || !email || !password) {
            showMessage(
                "Full name, phone, email and password are required.",
                "error"
            );
            return;
        }

        if (password.length < 6) {
            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );
            return;
        }

        if (password !== confirmPassword) {
            showMessage(
                "Passwords do not match.",
                "error"
            );
            return;
        }

        registerBtn.disabled = true;
        registerBtn.textContent = "Creating Account...";

        try {
            const response = await fetch(
                `${API_URL}/api/auth/register`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        // These names MUST match the backend.
                        full_name: fullName,
                        phone: phone,
                        email: email,
                        password: password,
                        referral_code: referralCode
                    })
                }
            );

            const data = await response.json();

            if (!response.ok || !data.success) {
                showMessage(
                    data.message || "Registration failed. Please try again.",
                    "error"
                );

                registerBtn.disabled = false;
                registerBtn.textContent = "Create Account";
                return;
            }

            showMessage(
                data.message || "Registration successful.",
                "success"
            );

            setTimeout(() => {
                window.location.href = "login.html";
            }, 1800);

        } catch (error) {
            console.error("Registration error:", error);

            showMessage(
                "Unable to connect to the server. Please try again.",
                "error"
            );

            registerBtn.disabled = false;
            registerBtn.textContent = "Create Account";
        }
    });

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }
</script>

</body>
</html>
