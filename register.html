<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - CheryEarn</title>

    <style>

        :root {
            --bg: #050e25;
            --header: #0b1535;
            --card: #0d1738;
            --border: #202d4e;

            --white: #f5f7fc;
            --muted: #9aa8c2;

            --blue: #1f5fea;
            --green: #43d878;
            --yellow: #f4cb2e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--white);
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        header {
            background: var(--header);
            border-bottom: 1px solid var(--border);
            padding: 18px 20px;
            text-align: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--white);
            margin-bottom: 5px;
        }

        .tagline {
            color: var(--muted);
            font-size: 13px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            padding: 25px 18px 35px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px 18px;
        }

        h1 {
            margin: 0 0 7px;
            font-size: 24px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--white);
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: var(--blue);
        }

        input::placeholder {
            color: #66738e;
        }

        .referral-box {
            display: none;
            margin-bottom: 16px;
            padding: 13px;
            border: 1px solid rgba(67, 216, 120, 0.35);
            border-radius: 10px;
            background: rgba(67, 216, 120, 0.08);
            text-align: center;
        }

        .referral-label {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 5px;
        }

        .referral-member {
            color: var(--green);
            font-size: 14px;
            font-weight: 700;
            word-break: break-word;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--green);
            color: #04100a;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            opacity: 0.92;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            text-align: center;
        }

        .message.error {
            display: block;
            background: rgba(220, 50, 50, 0.12);
            border: 1px solid rgba(220, 50, 50, 0.35);
            color: #ff7777;
        }

        .message.success {
            display: block;
            background: rgba(67, 216, 120, 0.10);
            border: 1px solid rgba(67, 216, 120, 0.35);
            color: var(--green);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
            font-size: 14px;
        }

        .login-link a {
            color: var(--green);
            text-decoration: none;
            font-weight: 700;
        }

        footer {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            padding: 0 20px 25px;
        }

    </style>
</head>

<body>

<header>

    <div class="logo">
        CheryEarn
    </div>

    <div class="tagline">
        Earn • Refer • Grow
    </div>

</header>


<div class="container">

    <div class="card">

        <h1>
            Create Account
        </h1>

        <div class="subtitle">
            Join CheryEarn today
        </div>


        <!-- ==========================================
             AUTOMATIC REFERRER
        =========================================== -->

        <div
            id="referralBox"
            class="referral-box"
        >

            <div class="referral-label">
                Referred by
            </div>

            <div
                id="referralMember"
                class="referral-member"
            >
            </div>

        </div>


        <form id="registerForm">


            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="0712345678"
                    autocomplete="tel"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="registerBtn"
                disabled
            >
                Verify Referral...
            </button>


            <div
                id="message"
                class="message"
            ></div>


        </form>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>


<footer>
    © 2026 CheryEarn. All rights reserved.
</footer>


<script>

    // ==================================================
    // BACKEND URL
    // ==================================================

    const API_URL =
        "https://cheryearn-backend.onrender.com";


    // ==================================================
    // ELEMENTS
    // ==================================================

    const form =
        document.getElementById(
            "registerForm"
        );


    const message =
        document.getElementById(
            "message"
        );


    const registerBtn =
        document.getElementById(
            "registerBtn"
        );


    const referralBox =
        document.getElementById(
            "referralBox"
        );


    const referralMember =
        document.getElementById(
            "referralMember"
        );


    // ==================================================
    // READ MEMBER FROM URL
    // ==================================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    const member =
        params.get("member");


    // ==================================================
    // INTERNAL REFERRAL CODE
    // ==================================================

    let referralCode =
        null;


    // ==================================================
    // RESOLVE REFERRAL
    // ==================================================

    async function resolveReferral() {

        if (!member) {

            showMessage(
                "Please use a valid CheryEarn referral link to register.",
                "error"
            );

            registerBtn.disabled =
                true;

            registerBtn.textContent =
                "Referral Required";

            return;

        }


        try {

            const response =
                await fetch(
                    `${API_URL}/api/referral/resolve/${encodeURIComponent(member)}`
                );


            const data =
                await response.json();


            console.log(
                "REFERRAL RESPONSE:",
                data
            );


            if (
                !response.ok ||
                !data.success
            ) {

                showMessage(
                    "This referral link is invalid.",
                    "error"
                );

                registerBtn.disabled =
                    true;

                registerBtn.textContent =
                    "Invalid Referral";

                return;

            }


            // ==========================================
            // SAVE INTERNAL REFERRAL CODE
            // ==========================================

            referralCode =
                data.referralCode;


            // ==========================================
            // DISPLAY REFERRER
            // ==========================================

            referralMember.textContent =
                data.member ||
                member;


            referralBox.style.display =
                "block";


            // ==========================================
            // ENABLE REGISTRATION
            // ==========================================

            registerBtn.disabled =
                false;

            registerBtn.textContent =
                "Create Account";


            message.className =
                "message";

            message.textContent =
                "";


        } catch (error) {

            console.error(
                "Referral resolution error:",
                error
            );


            showMessage(
                "Unable to verify referral link. Please try again.",
                "error"
            );


            registerBtn.disabled =
                true;

            registerBtn.textContent =
                "Referral Verification Failed";

        }

    }


    // ==================================================
    // START REFERRAL VERIFICATION
    // ==================================================

    resolveReferral();


    // ==================================================
    // REGISTRATION
    // ==================================================

    form.addEventListener(
        "submit",
        async function (e) {

            e.preventDefault();


            message.className =
                "message";

            message.textContent =
                "";


            // ==========================================
            // GET FORM VALUES
            // ==========================================

            const fullName =
                document
                    .getElementById("fullName")
                    .value
                    .trim();


            const phone =
                document
                    .getElementById("phone")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            // ==========================================
            // VALIDATION
            // ==========================================

            if (
                !fullName ||
                !phone ||
                !email ||
                !password
            ) {

                showMessage(
                    "Full name, phone, email and password are required.",
                    "error"
                );

                return;

            }


            if (
                password.length < 6
            ) {

                showMessage(
                    "Password must be at least 6 characters.",
                    "error"
                );

                return;

            }


            if (
                password !==
                confirmPassword
            ) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;

            }


            if (!referralCode) {

                showMessage(
                    "Valid referral verification is required.",
                    "error"
                );

                return;

            }


            registerBtn.disabled =
                true;

            registerBtn.textContent =
                "Creating Account...";


            try {

                // ======================================
                // REGISTER USER
                // ======================================

                const response =
                    await fetch(
                        `${API_URL}/api/auth/register`,
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    full_name:
                                        fullName,

                                    phone:
                                        phone,

                                    email:
                                        email,

                                    password:
                                        password,

                                    referral_code:
                                        referralCode

                                })

                        }
                    );


                const data =
                    await response.json();


                console.log(
                    "REGISTRATION RESPONSE:",
                    data
                );


                // ======================================
                // CHECK REGISTRATION
                // ======================================

                if (
                    !response.ok ||
                    !data.success
                ) {

                    showMessage(
                        data.message ||
                        "Registration failed. Please try again.",
                        "error"
                    );


                    registerBtn.disabled =
                        false;

                    registerBtn.textContent =
                        "Create Account";

                    return;

                }


                // ======================================
                // GET CREATED USER
                // ======================================

                const user =
                    data.user;


                if (
                    !user ||
                    !user.id
                ) {

                    showMessage(
                        "Account was created, but user information was not returned.",
                        "error"
                    );


                    registerBtn.disabled =
                        false;

                    registerBtn.textContent =
                        "Create Account";

                    return;

                }


                // ======================================
                // SAVE USER INFORMATION
                // ======================================

                localStorage.setItem(
                    "cheryearn_user_id",
                    String(user.id)
                );


                localStorage.setItem(
                    "cheryearn_user_phone",
                    user.phone ||
                    phone
                );


                localStorage.setItem(
                    "cheryearn_user_email",
                    user.email ||
                    email
                );


                localStorage.setItem(
                    "cheryearn_user_name",
                    user.full_name ||
                    fullName
                );


                localStorage.setItem(
                    "cheryearn_referral_code",
                    user.referral_code ||
                    ""
                );


                // ======================================
                // SUCCESS
                // ======================================

                showMessage(
                    "Account created successfully. Redirecting to payment...",
                    "success"
                );


                registerBtn.textContent =
                    "Continue to Payment";


                // ======================================
                // PAYMENT PAGE
                // ======================================

                setTimeout(
                    function () {

                        window.location.href =
                            "payment.html";

                    },
                    1200
                );


            } catch (error) {

                console.error(
                    "Registration error:",
                    error
                );


                showMessage(
                    "Unable to connect to the server. Please try again.",
                    "error"
                );


                registerBtn.disabled =
                    false;

                registerBtn.textContent =
                    "Create Account";

            }

        }
    );


    // ==================================================
    // MESSAGE FUNCTION
    // ==================================================

    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            "message " + type;

    }

</script>

</body>
</html>
