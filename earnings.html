<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnings - CheryEarn</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: #fff;
            min-height: 100vh;
        }

        .header {
            background: #151515;
            border-bottom: 1px solid #292929;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: #00c853;
            font-size: 24px;
            font-weight: 800;
        }

        .back {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 22px 16px 40px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .total-card {
            background: #00c853;
            color: #000;
            border-radius: 15px;
            padding: 22px;
            margin-bottom: 18px;
        }

        .total-card span {
            font-size: 14px;
            font-weight: 600;
        }

        .total-card h3 {
            font-size: 32px;
            margin-top: 7px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }

        .stat {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 13px;
            padding: 17px;
        }

        .stat span {
            display: block;
            color: #999;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .stat strong {
            font-size: 20px;
        }

        .section {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 13px;
            overflow: hidden;
        }

        .section-header {
            padding: 17px;
            border-bottom: 1px solid #292929;
        }

        .section-header h3 {
            font-size: 17px;
        }

        .earning {
            padding: 16px;
            border-bottom: 1px solid #242424;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .earning:last-child {
            border-bottom: none;
        }

        .earning-info strong {
            display: block;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .earning-info small {
            color: #888;
            font-size: 12px;
        }

        .amount {
            color: #00c853;
            font-weight: 800;
            white-space: nowrap;
            font-size: 14px;
        }

        .loading,
        .empty {
            padding: 30px 18px;
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        .error {
            color: #ff7777;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        @media (max-width: 380px) {
            .total-card h3 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="logo">CheryEarn</div>
    <a href="dashboard.html" class="back">← Dashboard</a>
</header>

<main class="container">

    <h2>My Earnings</h2>

    <p class="subtitle">
        View your earnings and referral commissions.
    </p>

    <div class="total-card">
        <span>Total Earnings</span>
        <h3>KSh <span id="totalEarnings">0.00</span></h3>
    </div>

    <div class="stats">

        <div class="stat">
            <span>Available Balance</span>
            <strong>
                KSh <span id="balance">0.00</span>
            </strong>
        </div>

        <div class="stat">
            <span>Referral Earnings</span>
            <strong>
                KSh <span id="referralEarnings">0.00</span>
            </strong>
        </div>

    </div>

    <div class="section">

        <div class="section-header">
            <h3>Earning History</h3>
        </div>

        <div id="earningsList">
            <div class="loading">
                Loading earnings...
            </div>
        </div>

    </div>

    <div id="error" class="error"></div>

</main>

<script>

    const API_URL = "https://cheryearn-backend.onrender.com";

    const token = localStorage.getItem("token");

    if (!token) {
        window.location.href = "login.html";
    }

    async function loadEarnings() {

        try {

            const response = await fetch(
                `${API_URL}/api/user/earnings`,
                {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                }
            );

            if (response.status === 401) {

                localStorage.removeItem("token");
                localStorage.removeItem("user");

                window.location.href = "login.html";

                return;
            }

            const data = await response.json();

            if (!response.ok || data.success === false) {
                throw new Error(
                    data.message || "Unable to load earnings."
                );
            }

            const user =
                data.user ||
                data.data?.user;

            const earnings =
                data.earnings ||
                data.data?.earnings ||
                [];

            const totalEarnings =
                data.totalEarnings ??
                data.data?.totalEarnings ??
                user?.totalEarnings ??
                0;

            const balance =
                data.balance ??
                data.data?.balance ??
                user?.balance ??
                0;

            const referralEarnings =
                data.referralEarnings ??
                data.data?.referralEarnings ??
                user?.referralEarnings ??
                0;

            document.getElementById("totalEarnings")
                .textContent =
                Number(totalEarnings).toFixed(2);

            document.getElementById("balance")
                .textContent =
                Number(balance).toFixed(2);

            document.getElementById("referralEarnings")
                .textContent =
                Number(referralEarnings).toFixed(2);

            displayEarnings(earnings);

        } catch (error) {

            document.getElementById("earningsList").innerHTML =
                `<div class="empty">
                    Unable to load earning history.
                </div>`;

            document.getElementById("error").textContent =
                error.message || "Something went wrong.";
        }
    }

    function displayEarnings(earnings) {

        const list =
            document.getElementById("earningsList");

        if (!Array.isArray(earnings) || earnings.length === 0) {

            list.innerHTML =
                `<div class="empty">
                    No earnings recorded yet.
                </div>`;

            return;
        }

        list.innerHTML = "";

        earnings.forEach((earning) => {

            const type =
                earning.type ||
                earning.source ||
                "Referral Commission";

            const description =
                earning.description ||
                earning.reason ||
                "Earning received";

            const amount =
                earning.amount ||
                earning.value ||
                earning.commission ||
                0;

            const date =
                earning.createdAt ||
                earning.date ||
                earning.timestamp;

            const item =
                document.createElement("div");

            item.className = "earning";

            item.innerHTML = `
                <div class="earning-info">
                    <strong>${escapeHtml(type)}</strong>
                    <small>
                        ${escapeHtml(description)}
                        ${date ? " • " + formatDate(date) : ""}
                    </small>
                </div>

                <div class="amount">
                    + KSh ${Number(amount).toFixed(2)}
                </div>
            `;

            list.appendChild(item);
        });
    }

    function formatDate(date) {

        const parsed = new Date(date);

        if (isNaN(parsed.getTime())) {
            return "";
        }

        return parsed.toLocaleDateString("en-KE", {
            day: "numeric",
            month: "short",
            year: "numeric"
        });
    }

    function escapeHtml(value) {

        const div = document.createElement("div");

        div.textContent = value ?? "";

        return div.innerHTML;
    }

    loadEarnings();

</script>

</body>
</html>
