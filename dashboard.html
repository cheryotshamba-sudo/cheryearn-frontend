<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheryEarn Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #02091f;
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 82px;
        }

        .page {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }

        /* ================= HEADER ================= */

        .header {
            height: 120px;
            background: #0d1a40;
            border-bottom: 1px solid #21335f;
            display: flex;
            align-items: center;
            padding: 0 28px;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 26px;
        }

        .menu-dots {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 34px;
            line-height: 1;
            cursor: pointer;
            width: 30px;
        }

        .brand {
            font-size: 38px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #263968;
            color: #ffffff;
            border-radius: 14px;
            padding: 14px 25px;
            font-family: "Poppins", sans-serif;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }

        /* ================= DROPDOWN ================= */

        .menu-wrapper {
            position: relative;
        }

        .dropdown {
            display: none;
            position: absolute;
            top: 42px;
            left: 0;
            width: 190px;
            background: #0d193d;
            border: 1px solid #263968;
            border-radius: 12px;
            padding: 7px;
            z-index: 1000;
            box-shadow: 0 12px 30px rgba(0,0,0,.4);
        }

        .dropdown.show {
            display: block;
        }

        .dropdown button {
            width: 100%;
            padding: 11px 12px;
            border: none;
            background: transparent;
            color: #ffffff;
            text-align: left;
            border-radius: 8px;
            font-family: "Poppins", sans-serif;
            cursor: pointer;
            font-size: 13px;
        }

        .dropdown button:hover {
            background: #172858;
        }

        /* ================= MAIN ================= */

        .content {
            padding: 38px 28px 25px;
        }

        .welcome-title {
            font-size: 37px;
            line-height: 1.2;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .welcome-subtitle {
            color: #9aa8c5;
            font-size: 20px;
            margin-bottom: 35px;
        }

        /* ================= BALANCE ================= */

        .balance-card {
            background: #0d193d;
            border: 1px solid #21335f;
            border-radius: 30px;
            padding: 42px;
            margin-bottom: 28px;
        }

        .balance-label {
            color: #9aa8c5;
            font-size: 21px;
            margin-bottom: 8px;
        }

        .balance-value {
            font-size: 55px;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        .withdraw-btn {
            background: #2864e8;
            border: none;
            color: #ffffff;
            border-radius: 18px;
            padding: 18px 42px;
            font-family: "Poppins", sans-serif;
            font-size: 21px;
            font-weight: 600;
            cursor: pointer;
        }

        /* ================= STATS ================= */

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: #0d193d;
            border: 1px solid #21335f;
            border-radius: 29px;
            padding: 31px 35px;
            min-height: 150px;
        }

        .stat-label {
            color: #9aa8c5;
            font-size: 19px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 29px;
            font-weight: 600;
        }

        .green {
            color: #42df83;
        }

        /* ================= REFERRAL SECTION ================= */

        .referral-section {
            background: #0d193d;
            border: 1px solid #21335f;
            border-radius: 30px;
            padding: 32px 35px;
        }

        .referral-title {
            font-size: 27px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .referral-description {
            color: #9aa8c5;
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .referral-box {
            border: 2px dashed #2864e8;
            border-radius: 18px;
            background: #020a24;
            padding: 17px 22px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .referral-link {
            flex: 1;
            color: #61a0ff;
            font-size: 17px;
            font-weight: 600;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .copy-btn {
            flex-shrink: 0;
            background: #2864e8;
            border: none;
            color: #ffffff;
            border-radius: 14px;
            padding: 15px 21px;
            font-family: "Poppins", sans-serif;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }

        .share-btn {
            width: 100%;
            background: #2864e8;
            border: none;
            color: #ffffff;
            border-radius: 17px;
            padding: 18px;
            font-family: "Poppins", sans-serif;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 25px;
        }

        /* ================= EARNINGS ================= */

        .earnings-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 13px;
        }

        .earnings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .earning-card {
            background: #07122f;
            border: 1px solid #21335f;
            border-radius: 16px;
            padding: 17px;
        }

        .earning-label {
            color: #9aa8c5;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .earning-value {
            color: #42df83;
            font-size: 21px;
            font-weight: 600;
        }

        /* ================= SUPPORT BUTTON ================= */

        .support-button {
            position: fixed;
            right: 24px;
            bottom: 92px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #20d66b;
            border: none;
            color: white;
            font-size: 31px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 900;
            box-shadow: 0 6px 18px rgba(0,0,0,.35);
        }

        /* ================= BOTTOM NAV ================= */

        .bottom-nav {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 78px;
            background: #0d1a40;
            border-top: 1px solid #21335f;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            z-index: 800;
        }

        .nav-btn {
            border: none;
            background: transparent;
            color: #9aa8c5;
            font-family: "Poppins", sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .nav-icon {
            font-size: 25px;
            line-height: 1;
        }

        .nav-btn.active {
            color: #61a0ff;
        }

        /* ================= TOAST ================= */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 90px;
            transform: translateX(-50%);
            background: #162858;
            color: #ffffff;
            padding: 11px 18px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
            z-index: 2000;
        }

        .toast.show {
            display: block;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .header {
                height: 118px;
                padding: 0 28px;
            }

            .header-left {
                gap: 23px;
            }

            .brand {
                font-size: 36px;
            }

            .logout-btn {
                padding: 13px 22px;
                font-size: 16px;
            }

            .content {
                padding: 38px 28px 25px;
            }

            .welcome-title {
                font-size: 36px;
            }

            .welcome-subtitle {
                font-size: 19px;
                margin-bottom: 34px;
            }

            .balance-card {
                padding: 41px;
                border-radius: 29px;
            }

            .balance-label {
                font-size: 20px;
            }

            .balance-value {
                font-size: 54px;
            }

            .stat-card {
                padding: 30px 34px;
                min-height: 148px;
            }

            .stat-label {
                font-size: 18px;
            }

            .stat-value {
                font-size: 28px;
            }

            .referral-section {
                padding: 31px 34px;
            }

            .referral-title {
                font-size: 26px;
            }

            .referral-description {
                font-size: 17px;
            }

            .referral-link {
                font-size: 16px;
            }

            .copy-btn {
                font-size: 16px;
                padding: 14px 18px;
            }

            .share-btn {
                font-size: 19px;
            }
        }

        @media (max-width: 390px) {

            .header {
                padding: 0 18px;
            }

            .content {
                padding-left: 18px;
                padding-right: 18px;
            }

            .brand {
                font-size: 29px;
            }

            .logout-btn {
                padding: 11px 15px;
                font-size: 14px;
            }

            .welcome-title {
                font-size: 30px;
            }

            .welcome-subtitle {
                font-size: 16px;
            }

            .balance-card {
                padding: 27px;
            }

            .balance-value {
                font-size: 43px;
            }

            .withdraw-btn {
                font-size: 17px;
                padding: 15px 30px;
            }

            .stat-card {
                padding: 23px;
            }

            .stat-label {
                font-size: 14px;
            }

            .stat-value {
                font-size: 22px;
            }

            .referral-section {
                padding: 24px;
            }

            .referral-title {
                font-size: 22px;
            }

            .referral-description {
                font-size: 14px;
            }

            .referral-box {
                padding: 13px;
            }

            .referral-link {
                font-size: 13px;
            }

            .copy-btn {
                padding: 11px 13px;
                font-size: 13px;
            }

            .share-btn {
                font-size: 16px;
            }

            .earnings-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- HEADER -->
    <header class="header">

        <div class="header-left">

            <div class="menu-wrapper">

                <button class="menu-dots" id="menuDots">⋮</button>

                <div class="dropdown" id="dropdownMenu">
                    <button onclick="goTo('dashboard.html')">Dashboard</button>
                    <button onclick="goTo('referrals.html')">Referrals</button>
                    <button onclick="goTo('earnings.html')">Earnings</button>
                    <button onclick="goTo('profile.html')">Profile</button>
                    <button onclick="logout()">Logout</button>
                </div>

            </div>

            <div class="brand">CheryEarn</div>

        </div>

        <button class="logout-btn" onclick="logout()">Logout</button>

    </header>


    <!-- MAIN -->
    <main class="content">

        <h1 class="welcome-title" id="welcomeTitle">
            Welcome, Cheryot
        </h1>

        <p class="welcome-subtitle">
            Your CheryEarn account overview
        </p>


        <!-- AVAILABLE BALANCE -->
        <section class="balance-card">

            <div class="balance-label">
                Available Balance
            </div>

            <div class="balance-value" id="availableBalance">
                KSh 0.00
            </div>

            <button class="withdraw-btn"
                    onclick="goTo('withdraw.html')">
                Withdraw
            </button>

        </section>


        <!-- TOTAL EARNINGS / REFERRALS -->
        <div class="stats">

            <div class="stat-card">

                <div class="stat-label">
                    Total Earnings
                </div>

                <div class="stat-value green"
                     id="totalEarnings">
                    KSh 0.00
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Total Referrals
                </div>

                <div class="stat-value"
                     id="totalReferrals">
                    0
                </div>

            </div>

        </div>


        <!-- REFERRAL -->
        <section class="referral-section">

            <div class="referral-title">
                Your Referral Link
            </div>

            <div class="referral-description">
                Share this link with people you want to invite:
            </div>


            <div class="referral-box">

                <div class="referral-link"
                     id="referralLink">
                    Loading referral link...
                </div>

                <button class="copy-btn"
                        onclick="copyReferralLink()">
                    Copy
                </button>

            </div>


            <button class="share-btn"
                    onclick="shareReferralLink()">
                Share Referral Link
            </button>


            <!-- DIRECT / INDIRECT EARNINGS -->
            <div class="earnings-title">
                Referral Earnings
            </div>

            <div class="earnings-grid">

                <div class="earning-card">

                    <div class="earning-label">
                        Direct Earnings
                    </div>

                    <div class="earning-value"
                         id="directEarnings">
                        KSh 0.00
                    </div>

                </div>


                <div class="earning-card">

                    <div class="earning-label">
                        Indirect Earnings
                    </div>

                    <div class="earning-value"
                         id="indirectEarnings">
                        KSh 0.00
                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- SUPPORT / WHATSAPP -->
<button class="support-button"
        onclick="openSupport()">
    ☎
</button>


<!-- BOTTOM NAV -->
<nav class="bottom-nav">

    <button class="nav-btn active"
            onclick="goTo('dashboard.html')">

        <span class="nav-icon">⌂</span>
        Home

    </button>


    <button class="nav-btn"
            onclick="goTo('invest.html')">

        <span class="nav-icon">📈</span>
        Invest

    </button>


    <button class="nav-btn"
            onclick="goTo('referrals.html')">

        <span class="nav-icon">👥</span>
        Referrals

    </button>


    <button class="nav-btn"
            onclick="goTo('profile.html')">

        <span class="nav-icon">👤</span>
        Profile

    </button>

</nav>


<div class="toast" id="toast"></div>


<script>

    /* =========================
       NAVIGATION
    ========================= */

    function goTo(page) {
        window.location.href = page;
    }


    /* =========================
       LOGOUT
    ========================= */

    function logout() {

        localStorage.removeItem("token");
        localStorage.removeItem("authToken");
        localStorage.removeItem("user");
        localStorage.removeItem("dashboardData");

        window.location.href = "login.html";
    }


    /* =========================
       THREE DOT MENU
    ========================= */

    const menuDots =
        document.getElementById("menuDots");

    const dropdownMenu =
        document.getElementById("dropdownMenu");


    menuDots.addEventListener("click", function(event) {

        event.stopPropagation();

        dropdownMenu.classList.toggle("show");

    });


    document.addEventListener("click", function(event) {

        if (
            !dropdownMenu.contains(event.target) &&
            !menuDots.contains(event.target)
        ) {

            dropdownMenu.classList.remove("show");

        }

    });


    /* =========================
       TOAST
    ========================= */

    function showToast(message) {

        const toast =
            document.getElementById("toast");

        toast.textContent = message;

        toast.classList.add("show");

        setTimeout(function() {

            toast.classList.remove("show");

        }, 1800);
    }


    /* =========================
       COPY REFERRAL
    ========================= */

    function copyReferralLink() {

        const link =
            document.getElementById("referralLink")
                .textContent.trim();


        if (
            !link ||
            link === "Loading referral link..."
        ) {

            showToast("Referral link not available");

            return;
        }


        navigator.clipboard.writeText(link)
            .then(function() {

                showToast(
                    "Referral link copied"
                );

            })
            .catch(function() {

                showToast(
                    "Unable to copy link"
                );

            });
    }


    /* =========================
       SHARE REFERRAL
    ========================= */

    function shareReferralLink() {

        const link =
            document.getElementById("referralLink")
                .textContent.trim();


        if (
            !link ||
            link === "Loading referral link..."
        ) {

            showToast("Referral link not available");

            return;
        }


        if (navigator.share) {

            navigator.share({

                title: "Join CheryEarn",

                text:
                    "Join CheryEarn using my referral link:",

                url: link

            }).catch(function() {});

        } else {

            navigator.clipboard.writeText(link)
                .then(function() {

                    showToast(
                        "Referral link copied"
                    );

                });

        }
    }


    /* =========================
       SUPPORT
    ========================= */

    function openSupport() {

        /*
         * Replace this only if your existing
         * support WhatsApp number is different.
         */

        const number = "";

        if (number) {

            window.open(
                "https://wa.me/" + number,
                "_blank"
            );

        } else {

            showToast("Support is available on WhatsApp");

        }
    }


    /* =========================
       MONEY
    ========================= */

    function formatMoney(value) {

        const amount =
            Number(value || 0);

        return "KSh " +
            amount.toLocaleString("en-KE", {

                minimumFractionDigits: 2,

                maximumFractionDigits: 2

            });
    }


    /* =========================
       LOAD DASHBOARD DATA
    ========================= */

    function applyDashboardData(data) {

        if (!data) return;


        const user =
            data.user ||
            data.profile ||
            data;


        /* NAME */

        const name =
            user.uniqueName ||
            user.username ||
            user.name ||
            user.fullName ||
            user.firstName ||
            "Cheryot";


        document.getElementById(
            "welcomeTitle"
        ).textContent =
            "Welcome, " + name;


        /* BALANCE */

        const balance =
            user.availableBalance ??
            user.balance ??
            data.availableBalance ??
            data.balance ??
            0;


        document.getElementById(
            "availableBalance"
        ).textContent =
            formatMoney(balance);


        /* TOTAL EARNINGS */

        const totalEarnings =
            user.totalEarnings ??
            data.totalEarnings ??
            0;


        document.getElementById(
            "totalEarnings"
        ).textContent =
            formatMoney(totalEarnings);


        /* DIRECT EARNINGS */

        const directEarnings =
            user.directEarnings ??
            data.directEarnings ??
            data.directReferralEarnings ??
            0;


        document.getElementById(
            "directEarnings"
        ).textContent =
            formatMoney(directEarnings);


        /* INDIRECT EARNINGS */

        const indirectEarnings =
            user.indirectEarnings ??
            data.indirectEarnings ??
            data.indirectReferralEarnings ??
            0;


        document.getElementById(
            "indirectEarnings"
        ).textContent =
            formatMoney(indirectEarnings);


        /* REFERRALS */

        const direct =
            data.directReferrals ||
            (
                data.referrals &&
                data.referrals.direct
            ) ||
            data.direct ||
            [];


        const indirect =
            data.indirectReferrals ||
            (
                data.referrals &&
                data.referrals.indirect
            ) ||
            data.indirect ||
            [];


        const total =
            data.totalReferrals ??
            user.totalReferrals ??
            direct.length + indirect.length;


        document.getElementById(
            "totalReferrals"
        ).textContent =
            total;


        /* REFERRAL LINK */

        const referralLink =
            user.referralLink ||
            user.referralCodeLink ||
            data.referralLink ||
            data.referralUrl ||
            data.referral_url ||
            "";


        if (referralLink) {

            document.getElementById(
                "referralLink"
            ).textContent =
                referralLink;

        }
    }


    /* =========================
       INITIAL DATA
    ========================= */

    async function loadDashboard() {

        try {

            const savedData =
                localStorage.getItem(
                    "dashboardData"
                );


            if (savedData) {

                try {

                    applyDashboardData(
                        JSON.parse(savedData)
                    );

                } catch (error) {

                    console.error(error);

                }
            }


            const savedUser =
                localStorage.getItem("user");


            if (savedUser) {

                try {

                    applyDashboardData({

                        user:
                            JSON.parse(savedUser)

                    });

                } catch (error) {

                    console.error(error);

                }
            }


            /*
             * Uses your existing dashboard
             * fetching function if your current
             * authentication code provides it.
             */

            if (
                typeof window.fetchDashboardData ===
                "function"
            ) {

                const response =
                    await window.fetchDashboardData();


                if (response) {

                    applyDashboardData(
                        response
                    );

                }

            }

        } catch (error) {

            console.error(
                "Dashboard error:",
                error
            );

        }
    }


    loadDashboard();

</script>

</body>
</html>
