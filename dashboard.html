.balance-card,

/* =========================

.bottom-nav{

.nav-btn{

.toast{

</nav><div class="toast" id="toast"></div><script>

const API_URL = "https://cheryearn-backend.onrender.com";


/* =========================
   THEME
========================= */

function applyTheme(){

    const savedTheme =
        localStorage.getItem("cheryearnTheme");

    const button =
        document.getElementById("themeBtn");

    if(savedTheme === "light"){

        document.body.classList.add("light-mode");
        button.textContent = "☾";

    }else{

        document.body.classList.remove("light-mode");
        button.textContent = "☀";

    }
}


function toggleTheme(){

    const isLight =
        document.body.classList.toggle("light-mode");

    localStorage.setItem(
        "cheryearnTheme",
        isLight ? "light" : "dark"
    );

    document.getElementById("themeBtn").textContent =
        isLight ? "☾" : "☀";
}

applyTheme();


/* =========================
   NAVIGATION
========================= */

function goTo(page){
    window.location.href = page;
}


/* =========================
   LOGOUT
========================= */

function logout(){

    localStorage.removeItem("token");
    localStorage.removeItem("authToken");
    localStorage.removeItem("user");
    localStorage.removeItem("dashboardData");

    window.location.href = "login.html";
}


/* =========================
   MENU
========================= */

const menuDots =
    document.getElementById("menuDots");

const dropdownMenu =
    document.getElementById("dropdownMenu");


menuDots.addEventListener("click",function(event){

    event.stopPropagation();

    dropdownMenu.classList.toggle("show");

});


document.addEventListener("click",function(event){

    if(
        !dropdownMenu.contains(event.target) &&
        !menuDots.contains(event.target)
    ){

        dropdownMenu.classList.remove("show");

    }

});


/* =========================
   TOAST
========================= */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(function(){

        toast.classList.remove("show");

    },1800);
}


/* =========================
   MONEY
========================= */

function formatMoney(value){

    const amount =
        Number(value || 0);

    return "KSh " +
        amount.toLocaleString("en-KE",{
            minimumFractionDigits:2,
            maximumFractionDigits:2
        });
}


/* =========================
   DATE
========================= */

function formatReferralDate(value){

    if(!value){
        return "";
    }

    const date = new Date(value);

    if(isNaN(date.getTime())){
        return "";
    }

    return date.toLocaleDateString("en-GB",{
        day:"2-digit",
        month:"short",
        year:"numeric"
    });
}


/* =========================
   COPY
========================= */

function copyReferralLink(){

    const link =
        document.getElementById("referralLink")
        .textContent.trim();

    if(
        !link ||
        link === "Loading referral link..."
    ){

        showToast("Referral link not available");
        return;
    }

    navigator.clipboard.writeText(link)
        .then(function(){

            showToast("Referral link copied");

        })
        .catch(function(){

            showToast("Unable to copy link");

        });
}


/* =========================
   SHARE
========================= */

function shareReferralLink(){

    const link =
        document.getElementById("referralLink")
        .textContent.trim();

    if(
        !link ||
        link === "Loading referral link..."
    ){

        showToast("Referral link not available");
        return;
    }

    if(navigator.share){

        navigator.share({
            title:"Join CheryEarn",
            text:"Join CheryEarn using my referral link:",
            url:link
        }).catch(function(){});

    }else{

        navigator.clipboard.writeText(link)
            .then(function(){

                showToast("Referral link copied");

            });

    }
}


/* =========================
   SUPPORT
========================= */

function openSupport(){

    const number = "";

    if(number){

        window.open(
            "https://wa.me/" + number,
            "_blank"
        );

    }else{

        showToast("Support is available on WhatsApp");

    }
}


/* =========================
   REFERRAL LINK
========================= */

function getReferralLink(data){

    const backendLink =
        data?.referralLink ||
        data?.data?.referralLink ||
        data?.user?.referralLink ||
        data?.user?.referral_link ||
        "";

    if(
        typeof backendLink === "string" &&
        backendLink.trim() !== ""
    ){

        return backendLink.trim();

    }

    const user =
        data?.user ||
        data?.profile ||
        data?.data?.user ||
        data?.data ||
        data ||
        {};

    let number =
        user.cheryearn_number ??
        user.cheryearnNumber ??
        data?.cheryearnNumber ??
        data?.cheryearn_number ??
        user.cheryearn_id ??
        user.cheryearnId ??
        data?.cheryearnId ??
        "";

    let cheryearnId =
        String(number).trim();

    if(cheryearnId){

        if(/^\d+$/.test(cheryearnId)){

            cheryearnId =
                "CheryEarn" +
                cheryearnId.padStart(3,"0");

        }else if(
            !cheryearnId.toLowerCase()
            .startsWith("cheryearn")
        ){

            const digits =
                cheryearnId.match(/\d+/);

            if(digits){

                cheryearnId =
                    "CheryEarn" +
                    digits[0].padStart(3,"0");

            }

        }

    }

    let username =
        user.username ||
        data?.username ||
        user.uniqueName ||
        user.unique_name ||
        "";

    username =
        String(username)
        .trim()
        .replace(/\s+/g,"")
        .replace(/[^a-zA-Z0-9_.-]/g,"");

    if(cheryearnId && username){

        return(
            "https://cheryearn1.onrender.com/register.html?member=" +
            encodeURIComponent(
                cheryearnId + "-" + username
            )
        );

    }

    return "";
}


/* =========================
   LOAD REFERRAL LINK
========================= */

async function loadReferralLink(){

    const element =
        document.getElementById("referralLink");

    const token =
        localStorage.getItem("token");

    if(!token){

        element.textContent =
            "Please login again";

        return;
    }

    try{

        const response =
            await fetch(
                `${API_URL}/api/referral-link`,
                {
                    method:"GET",
                    headers:{
                        "Authorization":
                            "Bearer " + token,
                        "Content-Type":
                            "application/json"
                    }
                }
            );

        const data =
            await response.json();

        if(
            response.ok &&
            data.success &&
            data.referralLink
        ){

            element.textContent =
                data.referralLink;

            localStorage.setItem(
                "cheryearnReferralLink",
                data.referralLink
            );

            return;
        }

        element.textContent =
            data.message ||
            "Unable to load referral link";

    }catch(error){

        console.error(error);

        element.textContent =
            "Unable to load referral link";

    }
}


/* =========================
   CUSTOMER NUMBER
========================= */

function getCustomerNumber(member,index){

    const possible =
        member.customerNumber ??
        member.customer_number ??
        member.customerId ??
        member.customer_id ??
        member.cheryearnNumber ??
        member.cheryearn_number ??
        member.cheryearnId ??
        member.cheryearn_id ??
        "";

    let value =
        String(possible).trim();

    /*
     * If backend returns something such as
     * CheryEarn003, display only 003.
     */
    const match =
        value.match(/(\d+)$/);

    if(match){

        return match[1].padStart(3,"0");

    }

    /*
     * Fallback to sequential customer number.
     */
    return String(index + 1).padStart(3,"0");
}


/* =========================
   DISPLAY REFERRALS
========================= */

function displayReferrals(data){

    const list =
        document.getElementById("referralsList");

    if(!list){
        return;
    }

    const direct =
        Array.isArray(data?.directReferrals)
        ? data.directReferrals
        : [];

    const indirect =
        Array.isArray(data?.indirectReferrals)
        ? data.indirectReferrals
        : [];


    const referrals = [

        ...direct.map(function(member){
            return{
                ...member,
                referralLevel:"Direct"
            };
        }),

        ...indirect.map(function(member){
            return{
                ...member,
                referralLevel:"Indirect"
            };
        })

    ];


    list.innerHTML = "";


    if(referrals.length === 0){

        list.innerHTML = `
            <tr>
                <td colspan="6" class="no-referrals">
                    No referrals yet
                </td>
            </tr>
        `;

        return;
    }


    referrals.forEach(function(member,index){

        const date =
            member.paidAt ||
            member.paid_at ||
            member.paymentDate ||
            member.payment_date ||
            member.completedAt ||
            member.completed_at ||
            member.createdAt ||
            member.created_at ||
            member.joinedAt ||
            member.joined_at ||
            "";


        const amount =
            member.amountPaid ??
            member.amount_paid ??
            member.paidAmount ??
            member.paid_amount ??
            member.paymentAmount ??
            member.payment_amount ??
            member.amount ??
            0;


        const rawStatus =
            member.paymentStatus ||
            member.payment_status ||
            member.status ||
            "PENDING";


        const status =
            String(rawStatus)
            .toUpperCase();


        let statusClass = "pending";

        if(
            status === "COMPLETED" ||
            status === "SUCCESS" ||
            status === "SUCCESSFUL" ||
            status === "PAID"
        ){

            statusClass = "completed";

        }else if(
            status === "FAILED" ||
            status === "CANCELLED" ||
            status === "REJECTED"
        ){

            statusClass = "failed";

        }


        const level =
            member.referralLevel ||
            member.level ||
            "Direct";


        const customer =
            getCustomerNumber(member,index);


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${index + 1}
            </td>

            <td>
                ${escapeHtml(
                    formatReferralDate(date) || "—"
                )}
            </td>

            <td>
                <span class="customer-number">
                    ${escapeHtml(customer)}
                </span>
            </td>

            <td>
                <span class="amount">
                    ${escapeHtml(formatMoney(amount))}
                </span>
            </td>

            <td>
                <span class="status ${statusClass}">
                    ${escapeHtml(status)}
                </span>
            </td>

            <td>
                <button
                    class="action-btn"
                    onclick="showReferralDetails(${index})">
                    View
                </button>
            </td>

        `;


        list.appendChild(row);

    });


    window.currentReferrals =
        referrals;
}


/* =========================
   REFERRAL DETAILS
========================= */

function showReferralDetails(index){

    const member =
        window.currentReferrals?.[index];

    if(!member){
        return;
    }

    const customer =
        getCustomerNumber(member,index);

    const level =
        member.referralLevel ||
        member.level ||
        "Direct";

    showToast(
        "Customer " +
        customer +
        " • " +
        level
    );
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   APPLY DASHBOARD DATA
========================= */

function applyDashboardData(data){

    if(!data){
        return;
    }

    const user =
        data.user ||
        data.profile ||
        data.data?.user ||
        data.data ||
        data;


    const name =
        user.username ||
        user.uniqueName ||
        user.name ||
        user.fullName ||
        user.full_name ||
        user.firstName ||
        "Cheryot";


    document.getElementById(
        "welcomeTitle"
    ).textContent =
        "Welcome, " + name;


    const balance =
        data.availableBalance ??
        data.balance ??
        user.availableBalance ??
        user.balance ??
        0;


    document.getElementById(
        "availableBalance"
    ).textContent =
        formatMoney(balance);


    const totalEarnings =
        data.totalEarnings ??
        user.totalEarnings ??
        0;


    document.getElementById(
        "totalEarnings"
    ).textContent =
        formatMoney(totalEarnings);


    const total =
        data.totalReferrals ??
        user.totalReferrals ??
        (
            (data.directReferrals || []).length +
            (data.indirectReferrals || []).length
        );


    document.getElementById(
        "totalReferrals"
    ).textContent =
        total;


    displayReferrals(data);


    const referralLink =
        getReferralLink(data);


    if(referralLink){

        document.getElementById(
            "referralLink"
        ).textContent =
            referralLink;

        localStorage.setItem(
            "cheryearnReferralLink",
            referralLink
        );

    }

}


/* =========================
   FETCH DASHBOARD
========================= */

window.fetchDashboardData =
async function(){

    const token =
        localStorage.getItem("token");


    if(!token){

        window.location.href =
            "login.html";

        return null;
    }


    const response =
        await fetch(
            `${API_URL}/api/user/dashboard`,
            {
                method:"GET",
                headers:{
                    "Authorization":
                        `Bearer ${token}`,
                    "Content-Type":
                        "application/json"
                }
            }
        );


    if(response.status === 401){

        localStorage.removeItem("token");
        localStorage.removeItem("authToken");
        localStorage.removeItem("user");
        localStorage.removeItem("dashboardData");

        window.location.href =
            "login.html";

        return null;
    }


    const data =
        await response.json();


    if(!response.ok){

        throw new Error(
            data.message ||
            "Unable to load dashboard."
        );

    }


    localStorage.setItem(
        "dashboardData",
        JSON.stringify(data)
    );


    return data;
};


/* =========================
   LOAD DASHBOARD
========================= */

async function loadDashboard(){

    try{

        const savedReferral =
            localStorage.getItem(
                "cheryearnReferralLink"
            );


        if(savedReferral){

            document.getElementById(
                "referralLink"
            ).textContent =
                savedReferral;

        }


        const savedData =
            localStorage.getItem(
                "dashboardData"
            );


        if(savedData){

            try{

                applyDashboardData(
                    JSON.parse(savedData)
                );

            }catch(error){

                console.error(
                    "Saved dashboard error:",
                    error
                );

            }

        }


        const savedUser =
            localStorage.getItem("user");


        if(savedUser){

            try{

                applyDashboardData({
                    user:JSON.parse(savedUser)
                });

            }catch(error){

                console.error(
                    "Saved user error:",
                    error
                );

            }

        }


        const response =
            await window.fetchDashboardData();


        if(response){

            applyDashboardData(response);

        }


        await loadReferralLink();


    }catch(error){

        console.error(
            "Dashboard error:",
            error
        );

        showToast(
            "Unable to load dashboard data"
        );

    }

}


loadDashboard();

</script></body>
