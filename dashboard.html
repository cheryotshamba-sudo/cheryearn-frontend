<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CheryEarn</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: #ffffff;
            min-height: 100vh;
        }

        .header {
            background: #151515;
            border-bottom: 1px solid #292929;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: #00c853;
            font-size: 24px;
            font-weight: 800;
        }

        .logout {
            background: #242424;
            color: #fff;
            border: 1px solid #333;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 20px 16px 40px;
        }

        .welcome {
            margin-bottom: 20px;
        }

        .welcome h2 {
            font-size: 23px;
            margin-bottom: 5px;
        }

        .welcome p {
            color: #999;
            font-size: 14px;
        }

        .balance-card {
            background: #00c853;
            color: #000;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 18px;
        }

        .balance-card .label {
            font-size: 14px;
            font-weight: 600;
            opacity: .8;
        }

        .balance {
            font-size: 34px;
            font-weight: 800;
            margin: 7px 0 15px;
        }

        .withdraw-btn {
            background: #000;
            color: #fff;
            border: none;
            padding: 11px 17px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }

        .stat {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 13px;
            padding: 17px;
        }

        .stat span {
            display: block;
            color: #999;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .stat strong {
            font-size: 21px;
        }

        .section {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 13px;
            padding: 18px;
            margin-bottom: 16px;
        }

        .section h3 {
            font-size: 17px;
            margin-bottom: 12px;
        }

        .referral-box {
            background: #0d0d0d;
            border: 1px dashed #00c853;
            border-radius: 9px;
            padding: 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .referral-code {
            color: #00c853;
            font-weight: 800;
            word-break: break-all;
        }

        .copy-btn {
            background: #00c853;
            color: #000;
            border: none;
            padding: 9px 12px;
            border-radius: 7px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }

        .share-btn {
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            background: #00c853;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
        }

        .loading {
            color: #999;
            font-size: 14px;
        }

        .error {
            color: #ff7777;
            font-size: 14px;
        }

        .nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 18px;
        }

        .nav a {
            text-decoration: none;
            text-align: center;
            background: #151515;
            border: 1px solid #292929;
            color: #fff;
            padding: 13px 5px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
        }

        .nav a:hover {
            border-color: #00c853;
            color: #00c853;
        }

        @media (max-width: 380px) {
            .balance {
                font-size: 29px;
            }

            .nav {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="logo">CheryEarn</div>
    <button class="logout" onclick="logout()">Logout</button>
</header>

<main class="container">

    <div class="welcome">
        <h2 id="welcomeName">Welcome</h2>
        <p>Your CheryEarn account overview</p>
    </div>

    <div class="balance-card">
        <div class="label">Available Balance</div>
        <div class="balance">
            KSh <span id="balance">0.00</span>
        </div>

        <button class="withdraw-btn" onclick="withdraw()">
            Withdraw
        </button>
    </div>

    <div class="stats">

        <div class="stat">
            <span>Total Earnings</span>
            <strong>KSh <span id="earnings">0.00</span></strong>
        </div>

        <div class="stat">
            <span>Total Referrals</span>
            <strong id="referrals">0</strong>
        </div>

    </div>

    <div class="section">

        <h3>Your Referral Code</h3>

        <div id="referralLoading" class="loading">
            Loading referral code...
        </div>

        <div
            id="referralContent"
            class="referral-box"
            style="display:none;"
        >
            <span id="referralCode" class="referral-code"></span>

            <button class="copy-btn" onclick="copyReferral()">
                Copy
            </button>
        </div>

        <button class="share-btn" onclick="shareReferral()">
            Share Referral Link
        </button>

    </div>

    <div class="section">

        <h3>Quick Links</h3>

        <div class="nav">
            <a href="referrals.html">Referrals</a>
            <a href="earnings.html">Earnings</a>
            <a href="withdraw.html">Withdraw</a>
        </div>

    </div>

    <div id="pageError" class="error"></div>

</main>

<script>

    const API_URL = "https://cheryearn-backend.onrender.com";

    const token = localStorage.getItem("token");

    if (!token) {
        window.location.href = "login.html";
    }

    async function loadDashboard() {

        try {

            const response = await fetch(
                `${API_URL}/api/user/dashboard`,
                {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                }
            );

            if (response.status === 401) {
                logout();
                return;
            }

            const data = await response.json();

            if (!response.ok || data.success === false) {
                throw new Error(
                    data.message || "Unable to load dashboard."
                );
            }

            const user = data.user || data.data?.user || data.data;

            if (user) {

                document.getElementById("welcomeName").textContent =
                    `Welcome, ${user.name || "User"}`;

                document.getElementById("balance").textContent =
                    Number(user.balance || 0).toFixed(2);

                document.getElementById("earnings").textContent =
                    Number(
                        user.totalEarnings ||
                        user.earnings ||
                        0
                    ).toFixed(2);

                document.getElementById("referrals").textContent =
                    user.totalReferrals ||
                    user.referrals ||
                    0;

                if (user.referralCode) {

                    document.getElementById("referralLoading")
                        .style.display = "none";

                    document.getElementById("referralContent")
                        .style.display = "flex";

                    document.getElementById("referralCode")
                        .textContent = user.referralCode;
                }
            }

        } catch (error) {

            document.getElementById("referralLoading")
                .textContent = "Unable to load account information.";

            document.getElementById("pageError")
                .textContent = error.message || "Something went wrong.";
        }
    }

    function copyReferral() {

        const code =
            document.getElementById("referralCode").textContent;

        if (!code) return;

        const link =
            `${window.location.origin}/register.html?ref=${encodeURIComponent(code)}`;

        navigator.clipboard.writeText(link)
            .then(() => {
                alert("Referral link copied!");
            })
            .catch(() => {
                alert(link);
            });
    }

    function shareReferral() {

        const code =
            document.getElementById("referralCode").textContent;

        if (!code) {
            alert("Referral code is still loading.");
            return;
        }

        const link =
            `${window.location.origin}/register.html?ref=${encodeURIComponent(code)}`;

        const text =
            `Join me on CheryEarn and start earning through referrals. Register here: ${link}`;

        if (navigator.share) {

            navigator.share({
                title: "Join CheryEarn",
                text: text,
                url: link
            });

        } else {

            navigator.clipboard.writeText(link)
                .then(() => {
                    alert("Referral link copied!");
                });
        }
    }

    function withdraw() {
        window.location.href = "withdraw.html";
    }

    function logout() {

        localStorage.removeItem("token");
        localStorage.removeItem("user");

        window.location.href = "login.html";
    }

    loadDashboard();

</script>

</body>
</html>
