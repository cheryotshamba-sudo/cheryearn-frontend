<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheryEarn Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --body-bg: #02091f;
        --card-bg: #0d193d;
        --header-bg: #0d1a40;
        --border: #21335f;
        --text: #ffffff;
        --muted: #9aa8c5;
        --blue: #2864e8;
        --blue-light: #61a0ff;
        --earning-bg: #07122f;
        --referral-bg: #020a24;
    }

    body.light-mode {
        --body-bg: #f3f6fc;
        --card-bg: #ffffff;
        --header-bg: #ffffff;
        --border: #d9e1ef;
        --text: #17213a;
        --muted: #68758d;
        --earning-bg: #f7f9fd;
        --referral-bg: #f5f8ff;
    }

    body {
        font-family: "Poppins", sans-serif;
        background: var(--body-bg);
        color: var(--text);
        min-height: 100vh;
        padding-bottom: 76px;
        transition: background .2s, color .2s;
    }

    .page {
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
    }

    .header {
        height: 88px;
        background: var(--header-bg);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 20px;
        justify-content: space-between;
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 17px;
    }

    .menu-dots {
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 27px;
        line-height: 1;
        cursor: pointer;
        width: 24px;
    }

    .brand {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -.6px;
    }

    .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .theme-btn {
        width: 38px;
        height: 36px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        border-radius: 10px;
        cursor: pointer;
        font-size: 17px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .logout-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 9px 15px;
        font-family: "Poppins", sans-serif;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }

    .menu-wrapper {
        position: relative;
    }

    .dropdown {
        display: none;
        position: absolute;
        top: 35px;
        left: 0;
        width: 165px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 6px;
        z-index: 1000;
        box-shadow: 0 12px 30px rgba(0,0,0,.25);
    }

    .dropdown.show {
        display: block;
    }

    .dropdown button {
        width: 100%;
        padding: 9px 10px;
        border: none;
        background: transparent;
        color: var(--text);
        text-align: left;
        border-radius: 7px;
        font-family: "Poppins", sans-serif;
        cursor: pointer;
        font-size: 12px;
    }

    .dropdown button:hover {
        background: rgba(40,100,232,.12);
    }

    .content {
        padding: 24px 20px 20px;
    }

    .welcome-title {
        font-size: 25px;
        line-height: 1.25;
        font-weight: 600;
        margin-bottom: 5px;
    }

    .welcome-subtitle {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 22px;
    }

    .balance-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 20px 22px;
        margin-bottom: 18px;
    }

    .balance-label {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 2px;
    }

    .balance-value {
        font-size: 31px;
        font-weight: 700;
        margin-bottom: 13px;
        letter-spacing: -.6px;
    }

    .withdraw-btn {
        background: var(--blue);
        border: none;
        color: #ffffff;
        border-radius: 11px;
        padding: 10px 21px;
        font-family: "Poppins", sans-serif;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }

    .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 18px;
    }

    .stat-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 19px;
        padding: 18px 19px;
        min-height: 91px;
    }

    .stat-label {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 5px;
    }

    .stat-value {
        font-size: 20px;
        font-weight: 600;
    }

    .green {
        color: #42df83;
    }

    .referral-section {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 21px 20px;
    }

    .referral-title {
        font-size: 19px;
        font-weight: 600;
        margin-bottom: 10px;
    }

    .referral-description {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        margin-bottom: 10px;
    }

    .referral-box {
        border: 1px dashed var(--blue);
        border-radius: 12px;
        background: var(--referral-bg);
        padding: 11px 12px;
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 12px;
    }

    .referral-link {
        flex: 1;
        color: var(--blue-light);
        font-size: 12px;
        font-weight: 600;
        line-height: 1.35;
        overflow-wrap: anywhere;
    }

    .copy-btn {
        flex-shrink: 0;
        background: var(--blue);
        border: none;
        color: #ffffff;
        border-radius: 9px;
        padding: 9px 12px;
        font-family: "Poppins", sans-serif;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
    }

    .share-btn {
        width: 100%;
        background: var(--blue);
        border: none;
        color: #ffffff;
        border-radius: 11px;
        padding: 11px;
        font-family: "Poppins", sans-serif;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 17px;
    }

    /* REFERRALS */
    .members-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 9px;
    }

    .referrals-list {
        display: flex;
        flex-direction: column;
        gap: 9px;
        margin-bottom: 17px;
    }

    .referral-member {
        background: var(--earning-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
    }

    .member-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 7px;
    }

    .member-left {
        min-width: 0;
        flex: 1;
    }

    .member-name {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .member-phone {
        color: var(--muted);
        font-size: 10px;
    }

    .member-right {
        flex-shrink: 0;
        text-align: right;
    }

    .member-level {
        display: inline-block;
        font-size: 9px;
        font-weight: 600;
        padding: 3px 7px;
        border-radius: 7px;
        background: rgba(40,100,232,.15);
        color: var(--blue-light);
        margin-right: 4px;
    }

    .member-status {
        display: inline-block;
        color: #42df83;
        font-size: 9px;
        font-weight: 600;
    }

    .member-details {
        border-top: 1px solid var(--border);
        padding-top: 7px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
    }

    .member-paid {
        font-size: 10px;
        color: var(--text);
        font-weight: 600;
    }

    .member-date {
        font-size: 9px;
        color: var(--muted);
        text-align: right;
    }

    .no-referrals {
        background: var(--earning-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 13px;
        color: var(--muted);
        font-size: 11px;
        text-align: center;
        margin-bottom: 17px;
    }

    .support-button {
        position: fixed;
        right: 17px;
        bottom: 87px;
        width: 51px;
        height: 51px;
        border-radius: 50%;
        background: #20d66b;
        border: none;
        color: white;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 900;
        box-shadow: 0 6px 18px rgba(0,0,0,.35);
    }

    .bottom-nav {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 70px;
        background: var(--header-bg);
        border-top: 1px solid var(--border);
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        z-index: 800;
    }

    .nav-btn {
        border: none;
        background: transparent;
        color: var(--muted);
        font-family: "Poppins", sans-serif;
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
    }

    .nav-icon {
        font-size: 21px;
        line-height: 1;
    }

    .nav-btn.active {
        color: var(--blue-light);
    }

    .toast {
        position: fixed;
        left: 50%;
        bottom: 82px;
        transform: translateX(-50%);
        background: #162858;
        color: #ffffff;
        padding: 9px 15px;
        border-radius: 9px;
        font-size: 12px;
        display: none;
        z-index: 2000;
    }

    .toast.show {
        display: block;
    }

    @media (max-width: 390px) {

        .header {
            height: 82px;
            padding: 0 16px;
        }

        .header-left {
            gap: 14px;
        }

        .brand {
            font-size: 23px;
        }

        .header-actions {
            gap: 5px;
        }

        .theme-btn {
            width: 34px;
            height: 33px;
            font-size: 15px;
        }

        .logout-btn {
            padding: 8px 12px;
            font-size: 12px;
        }

        .content {
            padding: 21px 16px 18px;
        }

        .welcome-title {
            font-size: 22px;
        }

        .welcome-subtitle {
            font-size: 13px;
            margin-bottom: 19px;
        }

        .balance-card {
            padding: 17px 18px;
            border-radius: 18px;
        }

        .balance-label {
            font-size: 13px;
        }

        .balance-value {
            font-size: 28px;
            margin-bottom: 11px;
        }

        .withdraw-btn {
            font-size: 13px;
            padding: 9px 18px;
        }

        .stat-card {
            padding: 15px;
            min-height: 82px;
        }

        .stat-label {
            font-size: 12px;
        }

        .stat-value {
            font-size: 18px;
        }

        .referral-section {
            padding: 18px;
        }

        .referral-title {
            font-size: 18px;
        }

        .referral-description {
            font-size: 12px;
        }

        .referral-link {
            font-size: 11px;
        }

        .copy-btn {
            padding: 8px 10px;
            font-size: 11px;
        }

        .share-btn {
            font-size: 13px;
            padding: 10px;
        }

        .members-title {
            font-size: 15px;
        }

        .member-name {
            font-size: 12px;
        }

        .member-phone {
            font-size: 9px;
        }

        .member-level {
            font-size: 8px;
        }

        .member-status {
            font-size: 8px;
        }

        .member-paid {
            font-size: 9px;
        }

        .member-date {
            font-size: 8px;
        }
    }
</style>

</head>

<body>

<div class="page">

<header class="header">

        <div class="menu-wrapper">

            <button class="menu-dots" id="menuDots">⋮</button>

                <button onclick="goTo('dashboard.html')">Dashboard</button>

    ☎

<nav class="bottom-nav">

        onclick="goTo('dashboard.html')">

        <span class="nav-icon">⌂</span>

    </button>


    <button

        <span class="nav-icon">📈</span>

        onclick="goTo('profile.html')">

        <span class="nav-icon">👤</span>

<div class="toast" id="toast"></div>


<script>

const API_URL = "https://cheryearn-backend.onrender.com";


/* =========================
   THEME
========================= */

function applyTheme() {

    const savedTheme =
        localStorage.getItem("cheryearnTheme");

    const button =
        document.getElementById("themeBtn");

    if (savedTheme === "light") {

        document.body.classList.add("light-mode");
        button.textContent = "☾";

    } else {

        document.body.classList.remove("light-mode");
        button.textContent = "☀";

    }
}


function toggleTheme() {

    const isLight =
        document.body.classList.toggle("light-mode");

    localStorage.setItem(
        "cheryearnTheme",
        isLight ? "light" : "dark"
    );

    document.getElementById("themeBtn").textContent =
        isLight ? "☾" : "☀";
}


applyTheme();


/* =========================
   NAVIGATION
========================= */

function goTo(page) {
    window.location.href = page;
}


/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem("token");
    localStorage.removeItem("authToken");
    localStorage.removeItem("user");
    localStorage.removeItem("dashboardData");

    window.location.href = "login.html";
}


/* =========================
   THREE DOT MENU
========================= */

const menuDots =
    document.getElementById("menuDots");

const dropdownMenu =
    document.getElementById("dropdownMenu");


menuDots.addEventListener("click", function(event) {

    event.stopPropagation();

    dropdownMenu.classList.toggle("show");

});


document.addEventListener("click", function(event) {

    if (
        !dropdownMenu.contains(event.target) &&
        !menuDots.contains(event.target)
    ) {

        dropdownMenu.classList.remove("show");

    }

});


/* =========================
   TOAST
========================= */

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(function() {

        toast.classList.remove("show");

    }, 1800);
}


/* =========================
   COPY REFERRAL
========================= */

function copyReferralLink() {

    const link =
        document.getElementById("referralLink")
            .textContent.trim();

    if (
        !link ||
        link === "Loading referral link..."
    ) {

        showToast("Referral link not available");

        return;
    }


    navigator.clipboard.writeText(link)
        .then(function() {

            showToast("Referral link copied");

        })
        .catch(function() {

            showToast("Unable to copy link");

        });
}


/* =========================
   SHARE REFERRAL
========================= */

function shareReferralLink() {

    const link =
        document.getElementById("referralLink")
            .textContent.trim();

    if (
        !link ||
        link === "Loading referral link..."
    ) {

        showToast("Referral link not available");

        return;
    }


    if (navigator.share) {

        navigator.share({

            title: "Join CheryEarn",

            text:
                "Join CheryEarn using my referral link:",

            url: link

        }).catch(function() {});

    } else {

        navigator.clipboard.writeText(link)
            .then(function() {

                showToast("Referral link copied");

            });
    }
}


/* =========================
   SUPPORT
========================= */

function openSupport() {

    const number = "";

    if (number) {

        window.open(
            "https://wa.me/" + number,
            "_blank"
        );

    } else {

        showToast(
            "Support is available on WhatsApp"
        );

    }
}


/* =========================
   MONEY
========================= */

function formatMoney(value) {

    const amount =
        Number(value || 0);

    return "KSh " +
        amount.toLocaleString(
            "en-KE",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );
}


/* =========================
   DATE & TIME
========================= */

function formatReferralDateTime(value) {

    if (!value) {
        return "";
    }

    const date = new Date(value);

    if (isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleString("en-KE", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
        hour12: true
    });
}


/* =========================
   REFERRAL LINK
========================= */

function getReferralLink(data) {

    const backendLink =
        data?.referralLink ||
        data?.data?.referralLink ||
        data?.user?.referralLink ||
        data?.user?.referral_link ||
        "";

    if (
        typeof backendLink === "string" &&
        backendLink.trim() !== ""
    ) {

        return backendLink.trim();
    }


    const user =
        data?.user ||
        data?.profile ||
        data?.data?.user ||
        data?.data ||
        data ||
        {};


    let number =
        user.cheryearn_number ??
        user.cheryearnNumber ??
        data?.cheryearnNumber ??
        data?.cheryearn_number ??
        user.cheryearn_id ??
        user.cheryearnId ??
        data?.cheryearnId ??
        "";


    let cheryearnId =
        String(number).trim();


    if (cheryearnId) {

        if (/^\d+$/.test(cheryearnId)) {

            cheryearnId =
                "CheryEarn" +
                cheryearnId.padStart(3, "0");

        } else if (
            !cheryearnId
                .toLowerCase()
                .startsWith("cheryearn")
        ) {

            const digits =
                cheryearnId.match(/\d+/);

            if (digits) {

                cheryearnId =
                    "CheryEarn" +
                    digits[0].padStart(3, "0");
            }
        }
    }


    let username =
        user.username ||
        data?.username ||
        user.uniqueName ||
        user.unique_name ||
        "";


    username =
        String(username)
            .trim()
            .replace(/\s+/g, "")
            .replace(/[^a-zA-Z0-9_.-]/g, "");


    if (
        cheryearnId &&
        username
    ) {

        return (
            "https://cheryearn1.onrender.com/register.html?member=" +
            encodeURIComponent(
                cheryearnId + "-" + username
            )
        );
    }


    return "";
}


/* =========================
   DIRECTLY LOAD USER REFERRAL LINK
========================= */

async function loadReferralLink() {

    const referralElement =
        document.getElementById("referralLink");

    const token =
        localStorage.getItem("token");


    if (!referralElement) {
        return;
    }


    if (!token) {

        referralElement.textContent =
            "Please login again";

        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/referral-link`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        console.log(
            "MY REFERRAL LINK:",
            data
        );


        if (
            response.ok &&
            data.success &&
            data.referralLink
        ) {

            referralElement.textContent =
                data.referralLink;

            localStorage.setItem(
                "cheryearnReferralLink",
                data.referralLink
            );

            return;
        }


        referralElement.textContent =
            data.message ||
            "Unable to load referral link";

    } catch (error) {

        console.error(
            "Referral link error:",
            error
        );

        referralElement.textContent =
            "Unable to load referral link";
    }
}


/* =========================
   DISPLAY REFERRALS
========================= */

function displayReferrals(data) {

    const referralsList =
        document.getElementById("referralsList");

    if (!referralsList) {
        return;
    }


    const direct =
        Array.isArray(data?.directReferrals)
            ? data.directReferrals
            : [];


    const indirect =
        Array.isArray(data?.indirectReferrals)
            ? data.indirectReferrals
            : [];


    /*
     * Keep Direct and Indirect information
     * visible without showing CheryEarn IDs.
     */
    const directWithLevel =
        direct.map(function(member) {

            return {
                ...member,
                referralLevel: "Direct"
            };

        });


    const indirectWithLevel =
        indirect.map(function(member) {

            return {
                ...member,
                referralLevel: "Indirect"
            };

        });


    const referrals = [
        ...directWithLevel,
        ...indirectWithLevel
    ];


    referralsList.innerHTML = "";


    if (referrals.length === 0) {

        referralsList.innerHTML = `
            <div class="no-referrals">
                No referrals yet
            </div>
        `;

        return;
    }


    referrals.forEach(function(member) {

        const name =
            member.fullName ||
            member.full_name ||
            member.name ||
            member.username ||
            "CheryEarn Member";


        /*
         * PHONE NUMBER
         *
         * Supports several possible backend
         * field names.
         */
        const phone =
            member.phone ||
            member.phoneNumber ||
            member.phone_number ||
            member.mobile ||
            member.mobileNumber ||
            member.mobile_number ||
            "";


        /*
         * Direct / Indirect
         */
        const level =
            member.referralLevel ||
            member.level ||
            "Direct";


        /*
         * Payment status
         */
        const status =
            member.paymentStatus ||
            member.payment_status ||
            member.status ||
            "Pending";


        const statusLower =
            String(status).toLowerCase();


        const statusText =
            statusLower === "completed" ||
            statusLower === "success" ||
            statusLower === "successful" ||
            statusLower === "paid"
                ? "Paid"
                : "Pending";


        /*
         * AMOUNT PAID
         *
         * Supports several possible backend
         * field names.
         */
        const amount =
            member.amountPaid ??
            member.amount_paid ??
            member.paidAmount ??
            member.paid_amount ??
            member.paymentAmount ??
            member.payment_amount ??
            member.amount ??
            0;


        /*
         * PAYMENT DATE/TIME
         *
         * We check payment time first,
         * then registration/join time.
         */
        const paymentDate =
            member.paidAt ||
            member.paid_at ||
            member.paymentDate ||
            member.payment_date ||
            member.paymentTime ||
            member.payment_time ||
            member.completedAt ||
            member.completed_at ||
            member.createdAt ||
            member.created_at ||
            member.joinedAt ||
            member.joined_at ||
            "";


        const formattedDateTime =
            formatReferralDateTime(paymentDate);


        const item =
            document.createElement("div");

        item.className =
            "referral-member";


        item.innerHTML = `

            <div class="member-top">

                <div class="member-left">

                    <div class="member-name">
                        ${escapeHtml(name)}
                    </div>

                    ${
                        phone
                        ? `
                            <div class="member-phone">
                                ${escapeHtml(phone)}
                            </div>
                        `
                        : ""
                    }

                </div>


                <div class="member-right">

                    <span class="member-level">
                        ${escapeHtml(level)}
                    </span>

                    <span
                        class="member-status"
                        style="${
                            statusText === "Paid"
                                ? ""
                                : "color:#f2b84b;"
                        }">
                        ${escapeHtml(statusText)}
                    </span>

                </div>

            </div>


            <div class="member-details">

                <div class="member-paid">
                    ${
                        statusText === "Paid"
                            ? escapeHtml(
                                formatMoney(amount)
                            ) + " paid"
                            : "Payment pending"
                    }
                </div>


                ${
                    formattedDateTime
                    ? `
                        <div class="member-date">
                            ${escapeHtml(
                                formattedDateTime
                            )}
                        </div>
                    `
                    : ""
                }

            </div>

        `;


        referralsList.appendChild(item);

    });
}


/* =========================
   SAFE HTML
========================= */

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   APPLY DASHBOARD DATA
========================= */

function applyDashboardData(data) {

    if (!data) {
        return;
    }


    const user =
        data.user ||
        data.profile ||
        data.data?.user ||
        data.data ||
        data;


    const name =
        user.username ||
        user.uniqueName ||
        user.name ||
        user.fullName ||
        user.full_name ||
        user.firstName ||
        "Cheryot";


    document.getElementById(
        "welcomeTitle"
    ).textContent =
        "Welcome, " + name;


    const balance =
        data.availableBalance ??
        data.balance ??
        user.availableBalance ??
        user.balance ??
        0;


    document.getElementById(
        "availableBalance"
    ).textContent =
        formatMoney(balance);


    const totalEarnings =
        data.totalEarnings ??
        user.totalEarnings ??
        0;


    document.getElementById(
        "totalEarnings"
    ).textContent =
        formatMoney(totalEarnings);


    const total =
        data.totalReferrals ??
        user.totalReferrals ??
        (
            (data.directReferrals || []).length +
            (data.indirectReferrals || []).length
        );


    document.getElementById(
        "totalReferrals"
    ).textContent =
        total;


    /*
     * Display actual referred members.
     */
    displayReferrals(data);


    const referralLink =
        getReferralLink(data);


    if (referralLink) {

        document.getElementById(
            "referralLink"
        ).textContent =
            referralLink;

        localStorage.setItem(
            "cheryearnReferralLink",
            referralLink
        );

    }

}


/* =========================
   FETCH DASHBOARD
========================= */

window.fetchDashboardData =
    async function() {

        const token =
            localStorage.getItem("token");


        if (!token) {

            window.location.href =
                "login.html";

            return null;
        }


        const response =
            await fetch(
                `${API_URL}/api/user/dashboard`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`,

                        "Content-Type":
                            "application/json"
                    }
                }
            );


        if (response.status === 401) {

            localStorage.removeItem("token");
            localStorage.removeItem("authToken");
            localStorage.removeItem("user");
            localStorage.removeItem("dashboardData");

            window.location.href =
                "login.html";

            return null;
        }


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to load dashboard."
            );
        }


        console.log(
            "DASHBOARD RESPONSE:",
            data
        );


        localStorage.setItem(
            "dashboardData",
            JSON.stringify(data)
        );


        return data;
    };


/* =========================
   LOAD DASHBOARD
========================= */

async function loadDashboard() {

    try {

        const savedReferral =
            localStorage.getItem(
                "cheryearnReferralLink"
            );


        if (savedReferral) {

            document.getElementById(
                "referralLink"
            ).textContent =
                savedReferral;

        }


        const savedData =
            localStorage.getItem(
                "dashboardData"
            );


        if (savedData) {

            try {

                applyDashboardData(
                    JSON.parse(savedData)
                );

            } catch (error) {

                console.error(
                    "Saved dashboard data error:",
                    error
                );
            }
        }


        const savedUser =
            localStorage.getItem("user");


        if (savedUser) {

            try {

                applyDashboardData({

                    user:
                        JSON.parse(savedUser)

                });

            } catch (error) {

                console.error(
                    "Saved user error:",
                    error
                );
            }
        }


        const response =
            await window.fetchDashboardData();


        if (response) {

            applyDashboardData(
                response
            );

        }


        await loadReferralLink();


    } catch (error) {

        console.error(
            "Dashboard error:",
            error
        );

        showToast(
            "Unable to load dashboard data"
        );
    }
}


loadDashboard();

</script>
