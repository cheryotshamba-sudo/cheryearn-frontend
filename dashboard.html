<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheryEarn Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #02091f;
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 75px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            margin: auto;
            padding: 12px;
        }

        /* HEADER */
        .header {
            background: #0d1a40;
            border: 1px solid #21335f;
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .brand-logo {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: #2864e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
        }

        .brand-name {
            font-size: 17px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .header-btn {
            border: 1px solid #21335f;
            background: #101f49;
            color: #ffffff;
            border-radius: 9px;
            padding: 7px 9px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        .menu-dots {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            border: 1px solid #21335f;
            background: #101f49;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        /* DROPDOWN */
        .menu-wrapper {
            position: relative;
        }

        .dropdown {
            position: absolute;
            right: 0;
            top: 42px;
            width: 175px;
            background: #0d193d;
            border: 1px solid #21335f;
            border-radius: 12px;
            padding: 7px;
            display: none;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,.35);
        }

        .dropdown.show {
            display: block;
        }

        .dropdown button {
            width: 100%;
            border: 0;
            background: transparent;
            color: #ffffff;
            padding: 10px;
            text-align: left;
            border-radius: 8px;
            font-family: inherit;
            cursor: pointer;
            font-size: 13px;
        }

        .dropdown button:hover {
            background: #16285a;
        }

        /* BALANCE */
        .balance-card {
            background: #0d193d;
            border: 1px solid #21335f;
            border-radius: 13px;
            padding: 11px 14px;
            margin-bottom: 8px;
        }

        .balance-label {
            color: #9aa8c5;
            font-size: 11px;
            margin-bottom: 2px;
        }

        .balance-amount {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.25;
        }

        .balance-actions {
            display: flex;
            gap: 7px;
            margin-top: 8px;
        }

        .primary-btn,
        .secondary-btn {
            flex: 1;
            border-radius: 8px;
            padding: 7px 8px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .primary-btn {
            background: #2864e8;
            border: 1px solid #2864e8;
            color: white;
        }

        .secondary-btn {
            background: transparent;
            border: 1px solid #2864e8;
            color: #61a0ff;
        }

        /* STATS */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 7px;
            margin-bottom: 9px;
        }

        .stat-card {
            background: #0d193d;
            border: 1px solid #21335f;
            border-radius: 11px;
            padding: 9px 7px;
            min-width: 0;
        }

        .stat-title {
            color: #9aa8c5;
            font-size: 9px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 700;
        }

        .green {
            color: #42df83;
        }

        /* SECTION */
        .section {
            background: #0d193d;
            border: 1px solid #21335f;
            border-radius: 13px;
            padding: 12px;
            margin-bottom: 9px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 9px;
        }

        /* REFERRAL LINK */
        .referral-link-box {
            display: flex;
            gap: 7px;
            margin-bottom: 9px;
        }

        .referral-link {
            flex: 1;
            min-width: 0;
            background: #07122f;
            border: 1px solid #21335f;
            color: #9fb5df;
            border-radius: 8px;
            padding: 8px;
            font-size: 10px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .copy-btn {
            background: #2864e8;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 11px;
            font-family: inherit;
            font-size: 10px;
            cursor: pointer;
        }

        /* REFERRAL TYPE */
        .referral-type {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .referral-type-left {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .referral-count {
            font-size: 12px;
            color: #61a0ff;
        }

        /* REFERRAL LIST */
        .referral-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .referral-card {
            background: #07122f;
            border: 1px solid #21335f;
            border-radius: 9px;
            padding: 8px;
        }

        .referral-top {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .member-name {
            font-size: 11px;
            font-weight: 600;
        }

        .member-id {
            color: #8999b9;
            font-size: 9px;
            margin-top: 1px;
        }

        .status {
            font-size: 9px;
            padding: 3px 6px;
            border-radius: 6px;
            background: rgba(66,223,131,.12);
            color: #42df83;
            white-space: nowrap;
            height: fit-content;
        }

        .referral-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-top: 6px;
        }

        .detail-item {
            color: #8f9db9;
            font-size: 8px;
        }

        .detail-value {
            display: block;
            color: #ffffff;
            font-size: 9px;
            margin-top: 1px;
        }

        .empty {
            color: #8999b9;
            font-size: 10px;
            text-align: center;
            padding: 12px 5px;
        }

        /* QUICK ACTIONS */
        .quick-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
        }

        .quick-btn {
            background: #07122f;
            border: 1px solid #21335f;
            color: #ffffff;
            border-radius: 9px;
            padding: 9px 4px;
            font-family: inherit;
            font-size: 9px;
            cursor: pointer;
        }

        .quick-icon {
            display: block;
            font-size: 16px;
            margin-bottom: 3px;
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 720px;
            background: #0d1a40;
            border-top: 1px solid #21335f;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            padding: 7px 6px;
            z-index: 500;
        }

        .nav-btn {
            border: 0;
            background: transparent;
            color: #8796b5;
            font-family: inherit;
            font-size: 9px;
            cursor: pointer;
            padding: 3px;
        }

        .nav-btn.active {
            color: #61a0ff;
        }

        .nav-icon {
            display: block;
            font-size: 17px;
            margin-bottom: 1px;
        }

        /* TOAST */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 78px;
            transform: translateX(-50%);
            background: #16285a;
            color: white;
            padding: 8px 13px;
            border-radius: 8px;
            font-size: 10px;
            display: none;
            z-index: 2000;
        }

        .toast.show {
            display: block;
        }

        /* LIGHT MODE */
        body.light-mode {
            background: #f4f7fc;
            color: #17213b;
        }

        body.light-mode .header,
        body.light-mode .balance-card,
        body.light-mode .stat-card,
        body.light-mode .section,
        body.light-mode .bottom-nav,
        body.light-mode .dropdown {
            background: #ffffff;
            border-color: #dbe3f2;
        }

        body.light-mode .header-btn,
        body.light-mode .menu-dots {
            background: #f4f7fc;
            color: #17213b;
            border-color: #dbe3f2;
        }

        body.light-mode .dropdown button {
            color: #17213b;
        }

        body.light-mode .dropdown button:hover {
            background: #eef3fb;
        }

        body.light-mode .referral-link,
        body.light-mode .referral-card,
        body.light-mode .quick-btn {
            background: #f7f9fd;
            border-color: #dbe3f2;
        }

        body.light-mode .detail-value,
        body.light-mode .member-name {
            color: #17213b;
        }

        body.light-mode .bottom-nav {
            border-top-color: #dbe3f2;
        }

        /* MOBILE */
        @media (max-width: 480px) {
            .container {
                padding: 9px;
            }

            .header {
                padding: 9px 10px;
            }

            .brand-name {
                font-size: 15px;
            }

            .header-btn {
                font-size: 10px;
                padding: 6px 7px;
            }

            .balance-card {
                padding: 10px 12px;
            }

            .balance-amount {
                font-size: 21px;
            }

            .stat-card {
                padding: 8px 6px;
            }

            .stat-value {
                font-size: 13px;
            }

            .section {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header class="header">
        <div class="brand">
            <div class="brand-logo">C</div>
            <div class="brand-name">CheryEarn</div>
        </div>

        <div class="header-actions">
            <button class="header-btn" id="themeToggle">☀️</button>
            <button class="header-btn" onclick="logout()">Logout</button>

            <div class="menu-wrapper">
                <button class="menu-dots" id="menuDots">⋮</button>

                <div class="dropdown" id="dropdownMenu">
                    <button onclick="goTo('dashboard.html')">Dashboard</button>
                    <button onclick="goTo('referrals.html')">Referrals</button>
                    <button onclick="goTo('earnings.html')">Earnings</button>
                    <button onclick="goTo('profile.html')">Profile</button>
                    <button onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <!-- AVAILABLE BALANCE -->
    <section class="balance-card">
        <div class="balance-label">Available Balance</div>
        <div class="balance-amount" id="availableBalance">KSh 0.00</div>

        <div class="balance-actions">
            <button class="primary-btn" onclick="goTo('deposit.html')">Deposit</button>
            <button class="secondary-btn" onclick="goTo('withdraw.html')">Withdraw</button>
        </div>
    </section>

    <!-- STATS -->
    <div class="stats">

        <div class="stat-card">
            <div class="stat-title">Total Earnings</div>
            <div class="stat-value green" id="totalEarnings">KSh 0.00</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">Referral Earnings</div>
            <div class="stat-value green" id="referralEarnings">KSh 0.00</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">Total Referrals</div>
            <div class="stat-value" id="totalReferrals">0</div>
        </div>

    </div>

    <!-- REFERRALS -->
    <section class="section">

        <div class="section-title">My Referrals</div>

        <div class="referral-link-box">
            <div class="referral-link" id="referralLink">
                Loading referral link...
            </div>

            <button class="copy-btn" onclick="copyReferralLink()">
                Copy
            </button>
        </div>

        <!-- DIRECT -->
        <div class="referral-type">
            <div class="referral-type-left">
                <strong style="font-size:12px;">Direct Referrals</strong>
                <span class="referral-count" id="directReferrals">0</span>
            </div>
        </div>

        <div class="referral-list" id="directReferralsList">
            <div class="empty">No direct referrals yet.</div>
        </div>

        <!-- INDIRECT -->
        <div class="referral-type" style="margin-top:12px;">
            <div class="referral-type-left">
                <strong style="font-size:12px;">Indirect Referrals</strong>
                <span class="referral-count" id="indirectReferrals">0</span>
            </div>
        </div>

        <div class="referral-list" id="indirectReferralsList">
            <div class="empty">No indirect referrals yet.</div>
        </div>

    </section>

    <!-- QUICK ACTIONS -->
    <section class="section">

        <div class="section-title">Quick Actions</div>

        <div class="quick-grid">

            <button class="quick-btn" onclick="goTo('deposit.html')">
                <span class="quick-icon">💰</span>
                Deposit
            </button>

            <button class="quick-btn" onclick="goTo('withdraw.html')">
                <span class="quick-icon">💸</span>
                Withdraw
            </button>

            <button class="quick-btn" onclick="goTo('referrals.html')">
                <span class="quick-icon">👥</span>
                Referrals
            </button>

            <button class="quick-btn" onclick="goTo('profile.html')">
                <span class="quick-icon">👤</span>
                Profile
            </button>

        </div>

    </section>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">

    <button class="nav-btn active" onclick="goTo('dashboard.html')">
        <span class="nav-icon">⌂</span>
        Home
    </button>

    <button class="nav-btn" onclick="goTo('referrals.html')">
        <span class="nav-icon">👥</span>
        Referrals
    </button>

    <button class="nav-btn" onclick="goTo('earnings.html')">
        <span class="nav-icon">💰</span>
        Earnings
    </button>

    <button class="nav-btn" onclick="goTo('profile.html')">
        <span class="nav-icon">👤</span>
        Profile
    </button>

</nav>

<div class="toast" id="toast"></div>

<script>
    /* =========================
       NAVIGATION
    ========================= */

    function goTo(page) {
        window.location.href = page;
    }


    /* =========================
       LOGOUT
    ========================= */

    function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("authToken");
        localStorage.removeItem("user");
        localStorage.removeItem("dashboardData");

        window.location.href = "login.html";
    }


    /* =========================
       THREE DOT MENU
    ========================= */

    const menuDots = document.getElementById("menuDots");
    const dropdownMenu = document.getElementById("dropdownMenu");

    menuDots.addEventListener("click", function(event) {
        event.stopPropagation();
        dropdownMenu.classList.toggle("show");
    });

    document.addEventListener("click", function(event) {
        if (!dropdownMenu.contains(event.target) &&
            !menuDots.contains(event.target)) {
            dropdownMenu.classList.remove("show");
        }
    });


    /* =========================
       LIGHT / DARK MODE
    ========================= */

    const themeToggle = document.getElementById("themeToggle");

    function applyTheme() {
        const savedTheme = localStorage.getItem("cheryearn_theme");

        if (savedTheme === "light") {
            document.body.classList.add("light-mode");
            themeToggle.textContent = "🌙";
        } else {
            document.body.classList.remove("light-mode");
            themeToggle.textContent = "☀️";
        }
    }

    themeToggle.addEventListener("click", function() {

        document.body.classList.toggle("light-mode");

        if (document.body.classList.contains("light-mode")) {
            localStorage.setItem("cheryearn_theme", "light");
            themeToggle.textContent = "🌙";
        } else {
            localStorage.setItem("cheryearn_theme", "dark");
            themeToggle.textContent = "☀️";
        }
    });

    applyTheme();


    /* =========================
       TOAST
    ========================= */

    function showToast(message) {
        const toast = document.getElementById("toast");

        toast.textContent = message;
        toast.classList.add("show");

        setTimeout(() => {
            toast.classList.remove("show");
        }, 1800);
    }


    /* =========================
       COPY REFERRAL LINK
    ========================= */

    function copyReferralLink() {

        const text = document.getElementById("referralLink").textContent.trim();

        if (!text || text === "Loading referral link...") {
            showToast("Referral link not available");
            return;
        }

        navigator.clipboard.writeText(text)
            .then(() => {
                showToast("Referral link copied");
            })
            .catch(() => {
                showToast("Unable to copy link");
            });
    }


    /* =========================
       FORMAT MONEY
    ========================= */

    function formatMoney(value) {

        const amount = Number(value || 0);

        return "KSh " + amount.toLocaleString("en-KE", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }


    /* =========================
       FORMAT DATE
    ========================= */

    function formatDate(value) {

        if (!value) {
            return "—";
        }

        const date = new Date(value);

        if (isNaN(date.getTime())) {
            return value;
        }

        return date.toLocaleString("en-KE", {
            dateStyle: "short",
            timeStyle: "short"
        });
    }


    /* =========================
       REFERRAL CARD
    ========================= */

    function createReferralCard(referral) {

        const name =
            referral.uniqueName ||
            referral.username ||
            referral.name ||
            referral.fullName ||
            referral.memberName ||
            "Member";

        const memberId =
            referral.memberId ||
            referral.userId ||
            referral.id ||
            referral.identifier ||
            "—";

        const joinedAt =
            referral.joinedAt ||
            referral.createdAt ||
            referral.registeredAt ||
            referral.joined;

        const amount =
            referral.amountPaid ??
            referral.paidAmount ??
            referral.amount ??
            referral.paymentAmount ??
            0;

        const status =
            referral.status ||
            referral.paymentStatus ||
            "Pending";

        const card = document.createElement("div");
        card.className = "referral-card";

        card.innerHTML = `
            <div class="referral-top">

                <div>
                    <div class="member-name">
                        ${escapeHtml(name)}
                    </div>

                    <div class="member-id">
                        ID: ${escapeHtml(String(memberId))}
                    </div>
                </div>

                <div class="status">
                    ${escapeHtml(String(status))}
                </div>

            </div>

            <div class="referral-details">

                <div class="detail-item">
                    Joined
                    <span class="detail-value">
                        ${escapeHtml(formatDate(joinedAt))}
                    </span>
                </div>

                <div class="detail-item">
                    Amount Paid
                    <span class="detail-value">
                        ${escapeHtml(formatMoney(amount))}
                    </span>
                </div>

                <div class="detail-item">
                    Status
                    <span class="detail-value">
                        ${escapeHtml(String(status))}
                    </span>
                </div>

            </div>
        `;

        return card;
    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* =========================
       RENDER REFERRALS
    ========================= */

    function renderReferralList(elementId, referrals) {

        const container = document.getElementById(elementId);

        container.innerHTML = "";

        if (!Array.isArray(referrals) || referrals.length === 0) {

            container.innerHTML =
                '<div class="empty">No referrals yet.</div>';

            return;
        }

        referrals.forEach(referral => {
            container.appendChild(
                createReferralCard(referral)
            );
        });
    }


    /* =========================
       DASHBOARD DATA
    ========================= */

    function applyDashboardData(data) {

        if (!data) return;

        const user =
            data.user ||
            data.profile ||
            data;

        const balance =
            user.availableBalance ??
            user.balance ??
            data.availableBalance ??
            data.balance ??
            0;

        const totalEarnings =
            user.totalEarnings ??
            data.totalEarnings ??
            0;

        const referralEarnings =
            user.referralEarnings ??
            data.referralEarnings ??
            0;

        document.getElementById("availableBalance").textContent =
            formatMoney(balance);

        document.getElementById("totalEarnings").textContent =
            formatMoney(totalEarnings);

        document.getElementById("referralEarnings").textContent =
            formatMoney(referralEarnings);


        const direct =
            data.directReferrals ||
            (data.referrals && data.referrals.direct) ||
            data.direct ||
            [];

        const indirect =
            data.indirectReferrals ||
            (data.referrals && data.referrals.indirect) ||
            data.indirect ||
            [];


        document.getElementById("directReferrals").textContent =
            direct.length;

        document.getElementById("indirectReferrals").textContent =
            indirect.length;

        document.getElementById("totalReferrals").textContent =
            direct.length + indirect.length;


        renderReferralList(
            "directReferralsList",
            direct
        );

        renderReferralList(
            "indirectReferralsList",
            indirect
        );


        const referralLink =
            user.referralLink ||
            user.referralCodeLink ||
            data.referralLink ||
            data.referralUrl ||
            data.referral_url ||
            "";

        if (referralLink) {
            document.getElementById("referralLink").textContent =
                referralLink;
        }
    }


    /* =========================
       LOAD DASHBOARD
    ========================= */

    async function loadDashboard() {

        try {

            const savedData =
                localStorage.getItem("dashboardData");

            if (savedData) {

                try {
                    applyDashboardData(
                        JSON.parse(savedData)
                    );
                } catch (error) {
                    console.error(error);
                }
            }


            const savedUser =
                localStorage.getItem("user");

            if (savedUser) {

                try {
                    applyDashboardData({
                        user: JSON.parse(savedUser)
                    });
                } catch (error) {
                    console.error(error);
                }
            }


            /*
             * If your existing authentication/dashboard
             * system provides fetchDashboardData(),
             * it will be used automatically.
             */

            if (typeof window.fetchDashboardData === "function") {

                const response =
                    await window.fetchDashboardData();

                if (response) {
                    applyDashboardData(response);
                }
            }

        } catch (error) {

            console.error(
                "Dashboard loading error:",
                error
            );
        }
    }


    loadDashboard();

</script>

</body>
</html>
