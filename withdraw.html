<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - CheryEarn</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: #fff;
            min-height: 100vh;
        }

        .header {
            background: #151515;
            border-bottom: 1px solid #292929;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: #00c853;
            font-size: 24px;
            font-weight: 800;
        }

        .back {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 22px 16px 40px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .balance-card {
            background: #00c853;
            color: #000;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .balance-card span {
            font-size: 13px;
            font-weight: 600;
        }

        .balance-card h3 {
            font-size: 30px;
            margin-top: 6px;
        }

        .card {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 14px;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            background: #0d0d0d;
            color: #fff;
            border: 1px solid #333;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #00c853;
        }

        .info {
            background: #101d15;
            border: 1px solid #193b27;
            color: #9ee8b7;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .withdraw-btn {
            width: 100%;
            padding: 15px;
            background: #00c853;
            color: #000;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .withdraw-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        .success {
            display: block;
            background: #10351e;
            color: #55e889;
        }

        .error {
            display: block;
            background: #3a1111;
            color: #ff7777;
        }

        .history {
            margin-top: 18px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 14px;
            overflow: hidden;
        }

        .history-header {
            padding: 17px;
            border-bottom: 1px solid #292929;
        }

        .history-header h3 {
            font-size: 17px;
        }

        .withdrawal {
            padding: 15px;
            border-bottom: 1px solid #242424;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .withdrawal:last-child {
            border-bottom: none;
        }

        .withdrawal-info strong {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .withdrawal-info small {
            color: #888;
            font-size: 12px;
        }

        .withdrawal-status {
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .pending {
            color: #ffc107;
        }

        .completed {
            color: #00c853;
        }

        .failed,
        .refunded {
            color: #ff7777;
        }

        .empty {
            padding: 28px;
            text-align: center;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header class="header">
    <div class="logo">CheryEarn</div>
    <a href="dashboard.html" class="back">← Dashboard</a>
</header>

<main class="container">

    <h2>Withdraw</h2>

    <p class="subtitle">
        Withdraw your available CheryEarn balance.
    </p>

    <div class="balance-card">
        <span>Available Balance</span>
        <h3>
            KSh <span id="balance">0.00</span>
        </h3>
    </div>

    <div class="card">

        <div class="info">
            Withdrawals are sent to your registered M-Pesa number.
            Make sure your phone number is correct before submitting.
        </div>

        <form id="withdrawForm">

            <div class="form-group">
                <label for="amount">Withdrawal Amount</label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    placeholder="Enter amount"
                    min="1"
                    step="1"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">M-Pesa Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="07XXXXXXXX"
                    required
                >
            </div>

            <button
                type="submit"
                class="withdraw-btn"
                id="withdrawBtn"
            >
                Request Withdrawal
            </button>

            <div id="message" class="message"></div>

        </form>

    </div>

    <div class="history">

        <div class="history-header">
            <h3>Withdrawal History</h3>
        </div>

        <div id="withdrawalList">
            <div class="empty">
                Loading withdrawal history...
            </div>
        </div>

    </div>

</main>

<script>

    const API_URL = "https://cheryearn-backend.onrender.com";

    const token = localStorage.getItem("token");

    if (!token) {
        window.location.href = "login.html";
    }

    let availableBalance = 0;

    async function loadAccount() {

        try {

            const response = await fetch(
                `${API_URL}/api/user/dashboard`,
                {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                }
            );

            if (response.status === 401) {
                logout();
                return;
            }

            const data = await response.json();

            if (!response.ok || data.success === false) {
                throw new Error(
                    data.message || "Unable to load account."
                );
            }

            const user =
                data.user ||
                data.data?.user ||
                data.data;

            if (user) {

                availableBalance =
                    Number(user.balance || 0);

                document.getElementById("balance")
                    .textContent =
                    availableBalance.toFixed(2);

                if (user.phone) {
                    document.getElementById("phone")
                        .value = user.phone;
                }
            }

        } catch (error) {

            showMessage(
                error.message || "Unable to load account.",
                "error"
            );
        }
    }

    async function loadWithdrawals() {

        try {

            const response = await fetch(
                `${API_URL}/api/user/withdrawals`,
                {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                }
            );

            if (response.status === 401) {
                logout();
                return;
            }

            const data = await response.json();

            if (!response.ok || data.success === false) {
                throw new Error(
                    data.message || "Unable to load withdrawals."
                );
            }

            const withdrawals =
                data.withdrawals ||
                data.data?.withdrawals ||
                data.data ||
                [];

            displayWithdrawals(withdrawals);

        } catch (error) {

            document.getElementById("withdrawalList")
                .innerHTML =
                `<div class="empty">
                    No withdrawal history available.
                </div>`;
        }
    }

    document.getElementById("withdrawForm")
        .addEventListener("submit", async function(e) {

        e.preventDefault();

        const amount =
            Number(document.getElementById("amount").value);

        const phone =
            document.getElementById("phone").value.trim();

        if (!amount || amount <= 0) {
            showMessage(
                "Enter a valid withdrawal amount.",
                "error"
            );
            return;
        }

        if (amount > availableBalance) {
            showMessage(
                "Insufficient available balance.",
                "error"
            );
            return;
        }

        if (!phone) {
            showMessage(
                "Enter your M-Pesa phone number.",
                "error"
            );
            return;
        }

        const button =
            document.getElementById("withdrawBtn");

        button.disabled = true;
        button.textContent = "Processing...";

        clearMessage();

        try {

            const response = await fetch(
                `${API_URL}/api/withdraw`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        amount: amount,
                        phone: phone
                    })
                }
            );

            if (response.status === 401) {
                logout();
                return;
            }

            const data = await response.json();

            if (!response.ok || data.success === false) {
                throw new Error(
                    data.message || "Withdrawal request failed."
                );
            }

            showMessage(
                data.message ||
                "Withdrawal request submitted successfully.",
                "success"
            );

            document.getElementById("amount").value = "";

            await loadAccount();
            await loadWithdrawals();

        } catch (error) {

            showMessage(
                error.message ||
                "Unable to process withdrawal.",
                "error"
            );

        } finally {

            button.disabled = false;
            button.textContent = "Request Withdrawal";
        }

    });

    function displayWithdrawals(withdrawals) {

        const list =
            document.getElementById("withdrawalList");

        if (!Array.isArray(withdrawals) ||
            withdrawals.length === 0) {

            list.innerHTML =
                `<div class="empty">
                    No withdrawals yet.
                </div>`;

            return;
        }

        list.innerHTML = "";

        withdrawals.forEach((withdrawal) => {

            const amount =
                Number(withdrawal.amount || 0)
                    .toFixed(2);

            const status =
                String(
                    withdrawal.status || "PENDING"
                ).toLowerCase();

            const date =
                withdrawal.createdAt ||
                withdrawal.date;

            const item =
                document.createElement("div");

            item.className = "withdrawal";

            item.innerHTML = `
                <div class="withdrawal-info">
                    <strong>KSh ${amount}</strong>
                    <small>
                        ${date ? formatDate(date) : "Withdrawal request"}
                    </small>
                </div>

                <div class="withdrawal-status ${getStatusClass(status)}">
                    ${escapeHtml(status.toUpperCase())}
                </div>
            `;

            list.appendChild(item);
        });
    }

    function getStatusClass(status) {

        if (status === "completed" ||
            status === "success" ||
            status === "successful") {
            return "completed";
        }

        if (status === "failed") {
            return "failed";
        }

        if (status === "refunded") {
            return "refunded";
        }

        return "pending";
    }

    function formatDate(date) {

        const parsed = new Date(date);

        if (isNaN(parsed.getTime())) {
            return "";
        }

        return parsed.toLocaleDateString("en-KE", {
            day: "numeric",
            month: "short",
            year: "numeric"
        });
    }

    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent = value ?? "";

        return div.innerHTML;
    }

    function showMessage(text, type) {

        const message =
            document.getElementById("message");

        message.className =
            `message ${type}`;

        message.textContent = text;
    }

    function clearMessage() {

        const message =
            document.getElementById("message");

        message.className = "message";
        message.textContent = "";
    }

    function logout() {

        localStorage.removeItem("token");
        localStorage.removeItem("user");

        window.location.href = "login.html";
    }

    loadAccount();
    loadWithdrawals();

</script>

</body>
</html>
